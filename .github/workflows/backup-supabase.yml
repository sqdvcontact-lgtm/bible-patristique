name: Sauvegarde Supabase

on:
  schedule:
    # Tous les jours à 3h00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Permet aussi de lancer manuellement depuis GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Installer pg_dump (PostgreSQL 17)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - name: Dump de la base
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          FILENAME="backup_$(date +'%Y-%m-%d_%H-%M').dump"
          pg_dump \
            --host=db.oucotpxcjalwgetylfbz.supabase.co \
            --port=5432 \
            --username=postgres \
            --dbname=postgres \
            --format=custom \
            --no-password \
            --file="$FILENAME"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "Taille : $(du -sh $FILENAME | cut -f1)"

      - name: Stocker l'artefact (conservé 90 jours)
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: ${{ env.FILENAME }}
          retention-days: 90
          compression-level: 9
