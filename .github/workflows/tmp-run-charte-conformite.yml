name: Temporaire - valider conformité charte

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/tmp-run-charte-conformite.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/charte-apparats-typographie
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Suite de tests hors test dépendant d’une image absente
        run: npx vitest run --exclude app/manuscrits/bible-899/_lib/tei.test.ts
      - name: Vérification TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Lint des fonctions typographiques
        run: npx eslint app/lib/typographie.ts app/lib/typographie.test.ts
      - name: Vérifier l’arbre de travail
        run: git diff --check
