name: Corpus Scriptura reader remediation pass 1

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/corpus-scriptura-pass1-reader-fix.yml'

permissions:
  contents: write

jobs:
  patch-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply the reader fix and its regression tests
        env:
          PATCH_SCRIPT_B64: 
        run: echo "$PATCH_SCRIPT_B64" | base64 -d | python

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: npx vitest run app/lib/oeuvreSelects.test.ts

      - name: Lint touched reader files
        run: npx eslint app/lib/oeuvreSelects.ts app/lib/oeuvreSelects.test.ts 'app/oeuvre/[id]/page.tsx' 'app/oeuvre/[id]/OeuvreClient.tsx'

      - name: Check diff
        run: git diff --check

      - name: Commit pass 1
        shell: bash
        run: |
          git config user.name 'Corpus Scriptura'
          git config user.email 'actions@users.noreply.github.com'
          git add app/lib/oeuvreSelects.ts app/lib/oeuvreSelects.test.ts 'app/oeuvre/[id]/page.tsx' 'app/oeuvre/[id]/OeuvreClient.tsx'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: distinguish unlevelled body from liminaries'
          git push origin HEAD:master
