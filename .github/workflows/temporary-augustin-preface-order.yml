name: Temporary Augustin preface order

on:
  push:
    paths:
      - '.github/workflows/temporary-augustin-preface-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/temporary_augustin_preface_order.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
      - name: Commit verified patch and cleanup
        run: |
          git config user.name "Corpus Scriptura automation"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/oeuvre/[id]/page.tsx'
          git rm scripts/temporary_augustin_preface_order.py .github/workflows/temporary-augustin-preface-order.yml
          git commit -m "Place la préface d’Augustin avant les livres"
          git push origin master
