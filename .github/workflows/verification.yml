name: Vérification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aelf-link-display-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Corriger les cas limites AELF
        run: node scripts/_oneoff_fix_aelf_link_edgecases.mjs
      - name: Installer les dépendances
        run: npm ci
      - name: Types (bloquant)
        run: npx tsc --noEmit
      - name: Tests (bloquant)
        run: npm test
      - name: Linter ciblé (informatif)
        continue-on-error: true
        run: npx eslint app/lib/liens.ts app/oeuvre/[id]/OeuvreClient.tsx
      - name: Enregistrer la passe validée
        run: |
          FICHIERS="app/lib/liens.ts app/oeuvre/[id]/OeuvreClient.tsx"
          if git diff --quiet -- $FICHIERS; then
            echo "Aucune correction AELF à enregistrer" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FICHIERS
          git commit -m "fix: conserver chapitres et merges dans les renvois AELF"
          git fetch origin agent/aelf-link-display-migration
          git rebase origin/agent/aelf-link-display-migration
          git push origin HEAD:agent/aelf-link-display-migration
