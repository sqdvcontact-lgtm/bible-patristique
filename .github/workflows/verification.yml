# Garde-fou du dépôt : à chaque poussée sur master, on vérifie que le code compile
# et que les tests passent. Rien ne l'assurait jusqu'ici, et un test cassé a pu être
# poussé en production sans que personne s'en aperçoive (19 août 2026).
#
# TEMPORAIRE SUR LA BRANCHE AELF BIBLE CLASSIQUE : la CI applique la transformation
# déterministe, la valide, puis n'enregistre que les trois fichiers métier. Ce bloc
# sera retiré avant fusion.

name: Vérification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aelf-bible-classique-migration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Appliquer la migration Bible classique AELF
        run: node scripts/_oneoff_migrate_bible_classique_aelf.mjs

      - name: Installer les dépendances
        run: npm ci

      - name: Types (bloquant)
        run: npx tsc --noEmit

      - name: Tests (bloquant)
        run: npm test

      - name: Linter ciblé (bloquant)
        run: npx eslint app/page.tsx app/lib/bibleMultimodeServer.ts app/components/TexteBible.tsx

      - name: Enregistrer la migration validée
        run: |
          if git diff --quiet -- app/page.tsx app/lib/bibleMultimodeServer.ts app/components/TexteBible.tsx; then
            echo "Aucune modification AELF à enregistrer" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/page.tsx app/lib/bibleMultimodeServer.ts app/components/TexteBible.tsx
          git commit -m "feat: basculer la Bible classique sur la spine AELF"
          git push origin HEAD:agent/aelf-bible-classique-migration
