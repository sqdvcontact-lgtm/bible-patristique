name: Vérification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aelf-exact-chapter-navigation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Sécuriser la navigation AELF exacte
        run: node scripts/_oneoff_exact_aelf_navigation.mjs
      - name: Installer les dépendances
        run: npm ci
      - name: Types (bloquant)
        run: npx tsc --noEmit
      - name: Tests (bloquant)
        run: npm test
      - name: Linter ciblé (informatif)
        continue-on-error: true
        run: npx eslint app/components/TexteBible.tsx
      - name: Enregistrer la passe validée
        run: |
          if git diff --quiet -- app/components/TexteBible.tsx; then
            echo "Navigation AELF exacte déjà appliquée"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/components/TexteBible.tsx
          git commit -m "fix: désambiguïser la navigation AELF"
          git fetch origin fix/aelf-exact-chapter-navigation
          git rebase origin/fix/aelf-exact-chapter-navigation
          git push origin HEAD:fix/aelf-exact-chapter-navigation
