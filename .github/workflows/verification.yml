name: Vérification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aelf-search-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Appliquer la migration AELF de la recherche
        run: node scripts/_oneoff_migrate_aelf_search.mjs
      - name: Installer les dépendances
        run: npm ci
      - name: Types (bloquant)
        run: npx tsc --noEmit
      - name: Tests (bloquant)
        run: npm test
      - name: Linter ciblé (informatif)
        continue-on-error: true
        run: npx eslint app/recherche/RechercheClient.tsx app/lib/rechercheBibleAelf.ts
      - name: Enregistrer la passe validée
        run: |
          if git diff --quiet -- app/recherche/RechercheClient.tsx; then
            echo "Aucune modification de recherche à enregistrer" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/recherche/RechercheClient.tsx
          git commit -m "refactor: projeter la recherche biblique vers AELF"
          git fetch origin agent/aelf-search-migration
          git rebase origin/agent/aelf-search-migration
          git push origin HEAD:agent/aelf-search-migration
