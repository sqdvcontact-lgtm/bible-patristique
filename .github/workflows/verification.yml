# Garde-fou du dépôt : à chaque poussée sur master, on vérifie que le code compile
# et que les tests passent. Rien ne l'assurait jusqu'ici, et un test cassé a pu être
# poussé en production sans que personne s'en aperçoive (19 août 2026).
#
# TEMPORAIRE SUR LA BRANCHE AELF : la CI applique la transformation déterministe du
# Polyglotte, la valide, puis l'enregistre. Ce bloc sera retiré avant fusion.

name: Vérification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aelf-polyglotte-migration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Corriger le migrateur temporaire
        run: node scripts/_oneoff_fix_aelf_migrator.mjs

      - name: Appliquer la bascule AELF du Polyglotte
        run: node scripts/_oneoff_migrate_polyglotte_aelf.mjs

      - name: Installer les dépendances
        run: npm ci

      - name: Types (bloquant)
        run: npx tsc --noEmit

      - name: Tests (bloquant)
        run: npm test

      - name: Enregistrer la bascule validée
        run: |
          if git diff --quiet -- app/polyglotte/page.tsx; then
            echo "Aucune modification AELF à enregistrer" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/polyglotte/page.tsx
          git commit -m "feat: basculer le Polyglotte sur la spine AELF"
          git push origin HEAD:agent/aelf-polyglotte-migration

      - name: Linter (informatif)
        id: linter
        continue-on-error: true
        run: |
          npx eslint app --format stylish | tee /tmp/eslint.txt
          echo "### Linter" >> "$GITHUB_STEP_SUMMARY"
          tail -3 /tmp/eslint.txt >> "$GITHUB_STEP_SUMMARY"
