name: Vérification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aelf-link-display-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Appliquer la migration du volet patristique AELF
        run: node scripts/_oneoff_migrate_aelf_link_panel.mjs
      - name: Installer les dépendances
        run: npm ci
      - name: Types (bloquant)
        run: npx tsc --noEmit
      - name: Tests (bloquant)
        run: npm test
      - name: Linter ciblé (informatif)
        continue-on-error: true
        run: npx eslint app/lib/liens.ts app/components/PanneauPatristique.tsx app/components/BibleLayout.tsx app/lib/traductions.ts
      - name: Enregistrer la passe validée
        run: |
          if git diff --quiet -- app/lib/liens.ts app/components/PanneauPatristique.tsx app/components/BibleLayout.tsx app/lib/traductions.ts; then
            echo "Aucune modification AELF à enregistrer" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/lib/liens.ts app/components/PanneauPatristique.tsx app/components/BibleLayout.tsx app/lib/traductions.ts
          git commit -m "refactor: résoudre le volet patristique via AELF"
          git push origin HEAD:agent/aelf-link-display-migration
