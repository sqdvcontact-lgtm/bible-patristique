# Garde-fou temporairement étendu sur la branche AELF Bible classique.
name: Vérification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aelf-bible-classique-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Migrer la disponibilité des livres
        run: node scripts/_oneoff_aelf_books_bible_layout.mjs
      - name: Installer les dépendances
        run: npm ci
      - name: Types (bloquant)
        run: npx tsc --noEmit
      - name: Tests (bloquant)
        run: npm test
      - name: Linter ciblé (informatif)
        continue-on-error: true
        run: npx eslint app/components/BibleLayout.tsx
      - name: Enregistrer la bascule validée
        run: |
          if git diff --quiet -- app/components/BibleLayout.tsx; then
            echo "Aucune modification à enregistrer" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/components/BibleLayout.tsx
          git commit -m "refactor: lire les livres disponibles via AELF"
          git push origin HEAD:agent/aelf-bible-classique-migration
