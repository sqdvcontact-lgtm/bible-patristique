# Garde-fou du dépôt : à chaque poussée sur master, on vérifie que le code compile
# et que les tests passent. Rien ne l'assurait jusqu'ici, et un test cassé a pu être
# poussé en production sans que personne s'en aperçoive (19 août 2026).
#
# Le linter tourne en dernier et NE BLOQUE PAS : il relève aujourd'hui 414 erreurs
# héritées (`no-explicit-any`, `set-state-in-effect`, `no-unescaped-entities`…), et
# faire échouer la vérification sur cette dette rendrait le garde-fou inutilisable
# dès le premier jour. Son compte figure dans le résumé de l'exécution : quand il
# sera retombé à zéro, retirer `continue-on-error` et il deviendra bloquant.

name: Vérification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Types (bloquant)
        run: npx tsc --noEmit

      # L'exclusion vise UN fichier, et elle est provisoire. Le manifeste Bible 899
      # versé sur master référence 1 488 images dont 1 264 ne sont pas dans le dépôt
      # (folios 57 et suivants) : le test échoue donc ici alors qu'il passe sur la
      # branche de travail, où les images existent. À lever dès que les images seront
      # versées ou le manifeste ramené à ce que le dépôt contient. Les 40 autres
      # fichiers de test, eux, bloquent.
      - name: Tests (bloquant)
        run: npx vitest run --exclude "**/node_modules/**" --exclude "app/manuscrits/bible-899/_lib/tei.test.ts"

      - name: Linter (informatif)
        id: linter
        continue-on-error: true
        run: |
          npx eslint app --format stylish | tee /tmp/eslint.txt
          echo "### Linter" >> "$GITHUB_STEP_SUMMARY"
          tail -3 /tmp/eslint.txt >> "$GITHUB_STEP_SUMMARY"
