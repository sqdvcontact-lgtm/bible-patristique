name: One-off AELF Polyglotte migration

on:
  push:
    branches: [agent/aelf-polyglotte-migration]
    paths:
      - scripts/_oneoff_migrate_polyglotte_aelf.mjs
      - .github/workflows/_oneoff-aelf-polyglotte.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aelf-polyglotte-migration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Appliquer la transformation déterministe
        run: node scripts/_oneoff_migrate_polyglotte_aelf.mjs

      - name: Installer les dépendances
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Enregistrer la bascule du Polyglotte
        run: |
          if git diff --quiet -- app/polyglotte/page.tsx; then
            echo "Aucune modification à enregistrer" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/polyglotte/page.tsx
          git commit -m "feat: basculer le Polyglotte sur la spine AELF"
          git push origin HEAD:agent/aelf-polyglotte-migration
