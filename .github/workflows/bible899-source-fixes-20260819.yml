name: Bible 899 — corrections source fac-similé 2026-08-19

on:
  push:
    paths:
      - '.github/workflows/bible899-source-fixes-20260819.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publier l’identifiant du run
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > work/bible899/source_fix_run_id.txt
          git config user.name 'Corpus Scriptura bot'
          git config user.email 'actions@users.noreply.github.com'
          git add work/bible899/source_fix_run_id.txt
          git commit -m 'chore: enregistrer le run des corrections source Bible 899'
          git pull --rebase origin master
          git push origin master
      - name: Appliquer les corrections au TEI et régénérer le manifeste
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib, re
          from datetime import datetime, timezone

          tei_path = Path('data/manuscrits/bible-899/Bible_899_master.xml')
          manifest_path = Path('data/manuscrits/bible-899/manifest.json')
          audit_path = Path('work/bible899/SOURCE_FIXES_20260819.json')
          checksum_path = Path('work/bible899/manifest_sha256.txt')

          text = tei_path.read_text(encoding='utf-8')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          expected_pre = {'folios':742,'columns':1484,'lines':58314,'choice':27107,'gap':8,'unclear':661,'add':2,'catchword':1}
          if manifest.get('counts') != expected_pre:
              raise SystemExit(f'Manifeste inattendu avant correction: {manifest.get("counts")}')

          patches = []

          def locate(xml_id):
              i = text.find(xml_id)
              if i < 0:
                  raise SystemExit(f'{xml_id}: identifiant introuvable dans le TEI')
              a = text.rfind('<l', 0, i)
              b = text.find('</l>', i)
              if a < 0 or b < 0:
                  raise SystemExit(f'{xml_id}: élément <l> introuvable autour de l’identifiant')
              b += 4
              elt = text[a:b]
              if xml_id not in elt or not re.match(r'<l(?:\s|>)', elt):
                  raise SystemExit(f'{xml_id}: mauvais élément localisé: {elt[:160]!r}')
              return a, b, elt

          def edit(xml_id, replacements, reason, break_no=False):
              global text
              a,b,old = locate(xml_id)
              new = old
              for before,after in replacements:
                  if before not in new:
                      raise SystemExit(f'{xml_id}: fragment attendu absent: {before!r}; élément={old!r}')
                  new = new.replace(before,after,1)
              if break_no and 'break="no"' not in new:
                  p = new.find('>')
                  new = new[:p] + ' break="no"' + new[p:]
              if new == old:
                  raise SystemExit(f'{xml_id}: transformation sans effet')
              text = text[:a] + new + text[b:]
              patches.append({'xml_id':xml_id,'action':'replace','reason':reason,'before':old,'after':new})

          def delete(xml_id, reason):
              global text
              a,b,old = locate(xml_id)
              text = text[:a] + text[b:]
              patches.append({'xml_id':xml_id,'action':'delete','reason':reason,'before':old})

          edit('f150r_b_l38', [(' sara',' sar')], 'Le fac-similé finit la colonne par « sar », poursuivi au verso par « aias » : sar|aias.')
          delete('f150r_b_l39', 'Ligne absente du fac-similé : duplication artificielle.')
          delete('f150r_b_l40', 'Ligne absente du fac-similé : duplication artificielle.')
          edit('f150v_a_l01', [('naias estoit escriuains.','aias estoit escriuains.')], 'Le verso commence par « aias », continuation de « sar ».')
          edit('f329v_a_l40', [(' conurent',' conu')], 'Lc 24,35 : coupure conu|rent ; la transcription dupliquait « rent ».', break_no=True)
          edit('f349v_a_l10', [(' saill',' sail')], 'Ac 3,8 : coupure sail|lant ; la transcription avait saill|liant.', break_no=True)
          edit('f349v_a_l11', [('liant esteut','lant esteut')], 'Ac 3,8 : suite de la coupure sail|lant.')

          post_counts = dict(manifest['counts'])
          post_counts['lines'] -= 2
          post_counts['choice'] -= 1
          expected_post = {'folios':742,'columns':1484,'lines':58312,'choice':27106,'gap':8,'unclear':661,'add':2,'catchword':1}
          if post_counts != expected_post:
              raise SystemExit(f'Comptes dérivés inattendus: {post_counts}')
          if len(re.findall(r'<l\b', text)) != 58312:
              raise SystemExit('Le compte réel des éléments <l> n’est pas 58 312 après correction.')
          if len(re.findall(r'<choice\b', text)) != 27106:
              raise SystemExit('Le compte réel des éléments <choice> n’est pas 27 106 après correction.')

          tei_path.write_text(text, encoding='utf-8')
          tei_sha = hashlib.sha256(tei_path.read_bytes()).hexdigest()
          manifest['teiSha256'] = tei_sha
          manifest['generatedAt'] = datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          manifest['counts'] = post_counts
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          checksum_path.write_text(manifest_sha + '\n', encoding='utf-8')
          audit_path.write_text(json.dumps({
              'date':'2026-08-19','basis':'facsimile','patches':patches,
              'tei_sha256':tei_sha,'manifest_sha256':manifest_sha,'counts':post_counts
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Valider et publier
        run: |
          git diff --check
          git config user.name 'Corpus Scriptura bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/manuscrits/bible-899/Bible_899_master.xml data/manuscrits/bible-899/manifest.json work/bible899/SOURCE_FIXES_20260819.json work/bible899/manifest_sha256.txt
          git commit -m 'Bible 899 : corriger les anomalies source vérifiées au fac-similé'
          git pull --rebase origin master
          git push origin master
