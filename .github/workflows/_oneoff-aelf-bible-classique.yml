name: One-off AELF Bible classique

on:
  push:
    branches: [agent/aelf-bible-classique-migration]
    paths:
      - scripts/_oneoff_migrate_bible_classique_aelf.mjs
      - .github/workflows/_oneoff-aelf-bible-classique.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aelf-bible-classique-migration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Appliquer la transformation AELF
        run: node scripts/_oneoff_migrate_bible_classique_aelf.mjs
      - name: Installer les dépendances
        run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Linter ciblé
        run: npx eslint app/page.tsx app/lib/bibleMultimodeServer.ts app/components/TexteBible.tsx
      - name: Enregistrer la migration validée
        run: |
          if git diff --quiet -- app/page.tsx app/lib/bibleMultimodeServer.ts app/components/TexteBible.tsx; then
            echo "Aucune modification à enregistrer" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/page.tsx app/lib/bibleMultimodeServer.ts app/components/TexteBible.tsx
          git commit -m "feat: basculer la Bible classique sur la spine AELF"
          git push origin HEAD:agent/aelf-bible-classique-migration
