name: Corpus Scriptura reader remediation pass 1 v3

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/corpus-scriptura-pass1-reader-fix-v3.yml'

permissions:
  contents: write

jobs:
  patch-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reader fix
        shell: bash
        run: |
          PATCH_SCRIPT_B64="$(sed -n 's/^          PATCH_SCRIPT_B64: //p' .github/workflows/corpus-scriptura-pass1-reader-fix-v2.yml)"
          test -n "$PATCH_SCRIPT_B64"
          printf '%s' "$PATCH_SCRIPT_B64" | base64 -d | python
          sed -i 's/espace_texuel/espace_textuel/g' app/lib/oeuvreLiminaires.test.ts

      - name: Install dependencies
        run: npm ci

      - name: Run reader tests
        run: npx vitest run app/lib/oeuvreSelects.test.ts app/lib/oeuvreLiminaires.test.ts

      - name: Lint touched files
        run: npx eslint app/lib/oeuvreSelects.ts app/lib/oeuvreLiminaires.test.ts 'app/oeuvre/[id]/page.tsx' 'app/oeuvre/[id]/OeuvreClient.tsx'

      - name: Check diff
        run: git diff --check

      - name: Commit pass 1
        shell: bash
        run: |
          git config user.name 'Corpus Scriptura'
          git config user.email 'actions@users.noreply.github.com'
          git add app/lib/oeuvreSelects.ts app/lib/oeuvreLiminaires.test.ts 'app/oeuvre/[id]/page.tsx' 'app/oeuvre/[id]/OeuvreClient.tsx'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: distinguish unlevelled body from liminaries'
          git push origin HEAD:master
