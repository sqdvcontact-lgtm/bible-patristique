<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>La Gueule — Atelier de relecture</title>
<link rel="icon" type="image/png" href="/logo-vert.png?v=20260808" />
<style>
  :root{--fond:#f7f3ea;--surface:#fffdf8;--encre:#2b2620;--second:#6b6155;--bord:#d9ccb4;
    --vert:#5a7260;--vertf:rgba(90,114,96,.12);--ambre:#9a5a2a;--surlig:rgba(154,90,42,.28)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--fond);color:var(--encre);font-family:"Segoe UI",system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column}
  header{padding:11px 20px;border-bottom:1px solid var(--bord);background:var(--surface);display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  header h1{margin:0;font-family:Georgia,serif;font-weight:500;font-size:17px}
  header .logo{height:30px;width:58px;display:block;object-fit:contain;flex:none}
  header .sep{flex:1}
  label{font-size:12px;color:var(--second)}
  input,select{padding:5px 8px;border:1px solid var(--bord);border-radius:6px;background:#fff;color:var(--encre);font:inherit;transition:border-color .12s}
  input:focus,select:focus{outline:none;border-color:var(--vert)}
  input[type=number]{width:64px}
  #chemin{width:min(46vw,560px)}
  button{cursor:pointer;border:1px solid var(--vert);border-radius:6px;background:var(--vertf);color:var(--vert);padding:6px 12px;font:inherit;font-weight:600;transition:background .12s,border-color .12s,color .12s}
  button:hover:not(:disabled){background:var(--vert);color:#fff}
  button.discret{border-color:var(--bord);color:var(--second);background:var(--surface);font-weight:400}
  button.discret:hover:not(:disabled){border-color:var(--vert);color:var(--vert);background:var(--surface)}
  button:disabled{opacity:.5;cursor:default}
  #etat{font-size:12px;color:var(--second)}
  main{flex:1;display:grid;grid-template-columns:262px 1fr 1fr;gap:0;min-height:0}
  main.meta-replie{grid-template-columns:32px 1fr 1fr}
  .volet{min-height:0;overflow:auto;padding:12px}
  /* Colonne « Métadonnées » (gauche), repliable */
  .volet-meta{min-height:0;overflow:auto;border-right:1px solid var(--bord);background:var(--surface);display:flex;flex-direction:column}
  .meta-tete{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--bord);position:sticky;top:0;background:var(--surface);z-index:1}
  .meta-titre{font-family:Georgia,serif;font-size:14px;color:var(--encre);flex:1}
  .meta-toggle{border:1px solid var(--bord);background:#fff;color:var(--second);border-radius:5px;padding:2px 8px;cursor:pointer;font-weight:700;line-height:1}
  .meta-corps{padding:10px;display:flex;flex-direction:column;gap:8px}
  .meta-corps label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--second)}
  .meta-corps input{width:100%;font-size:13px}
  .meta-corps input.meta-auto{background:#e7e5df;color:#1f1f1f} /* deviné par le parseur (remplaçable par l'IA) */
  .meta-corps input.meta-ia{background:#fbeecb;border-color:#c9971f;color:#1a1a1a;font-weight:500} /* proposé par l'IA (lecture d'image), à vérifier */
  .meta-etat{font-size:11px;color:var(--second);min-height:1em;margin-top:2px}
  main.meta-replie .meta-titre,main.meta-replie .meta-extraire,main.meta-replie .meta-corps{display:none}
  main.meta-replie .meta-tete{flex-direction:column;padding:8px 3px;border-bottom:none}
  /* Zone image : l'image tient dans la hauteur du volet (pas de défilement) ; chevrons de nav. */
  #voletImage{background:#efe8da;border-right:1px solid var(--bord);position:relative;overflow:hidden;
    display:flex;align-items:flex-start;justify-content:center;padding:12px}
  #imgHolder{max-width:100%;max-height:100%;display:flex;align-items:flex-start;justify-content:center}
  .scene{position:relative;display:inline-block;box-shadow:0 2px 12px rgba(0,0,0,.15);background:#fff}
  .scene img{display:block;max-width:100%;height:auto}
  /* Passe 3 : zoom sur la région d'une lettrine (clic n'importe où pour fermer). */
  #zoomOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:10001;cursor:zoom-out}
  .zoombox{background-repeat:no-repeat;background-color:#fff;box-shadow:0 8px 40px rgba(0,0,0,.5);border:3px solid #fff;border-radius:4px}
  /* Pipeline 5 étapes (Phase A) : représentation persistante de l'état du parcours. */
  #barreEtapes{display:flex;gap:6px;align-items:stretch;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--bord)}
  .etape{flex:1;display:flex;flex-direction:column;gap:2px;padding:5px 9px;border:1px solid var(--bord);border-radius:7px;background:var(--fond);min-width:0}
  .etape .num{font-size:9px;color:var(--second);letter-spacing:.05em}
  .etape .lib{font-size:12px;font-weight:600;color:var(--texte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .etape .badge{font-size:10px;padding:1px 7px;border-radius:999px;align-self:flex-start;margin-top:1px}
  .etape.active{border-color:var(--vert);box-shadow:0 0 0 1px var(--vert) inset}
  .badge.non_commence{background:#ececec;color:#888}
  .badge.pret{background:#e6f0e6;color:#3d6b4f}
  .badge.en_cours{background:#fef3d8;color:#b26a1a}
  .badge.termine{background:#e2f0e2;color:#2e5440}
  .badge.a_verifier{background:#fdf0d8;color:#a8720f}
  .badge.perime{background:#fbe6de;color:#b5482a}
  .badge.bloque,.badge.erreur{background:#fadbd0;color:#9a2a2a}
  [data-theme="dark"] #barreEtapes{background:#241f1a}
  [data-theme="dark"] .etape{background:#2a2520;border-color:#3a332b}
  /* Phase E — panneau de validation ciblée (familles + critiques + blocages). */
  #panneauValidation{padding:8px 12px;background:var(--fond-clair,#faf8f4);border-bottom:1px solid var(--bord);font-size:13px}
  #panneauValidation .val-tete{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
  #panneauValidation .val-fam{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:3px 0;border-top:1px solid var(--bord-clair,#e4dfd8)}
  #panneauValidation .val-fam span{color:var(--second)}
  #panneauValidation .val-bloc{margin-top:6px;color:#9a2a2a;font-weight:600}
  #panneauValidation .val-crit{margin-top:6px;padding:6px 8px;border:1px solid #e0b57a;border-radius:6px;background:#fdf6ec}
  #panneauValidation .val-crit-tete{font-weight:600;color:#8a5a1a;font-size:12px}
  #panneauValidation .val-avapr{margin:3px 0;font-size:13px}
  #panneauValidation .val-avapr .av{color:#9a2a2a;text-decoration:line-through}
  #panneauValidation .val-avapr .apr{color:#2e5440;font-weight:600}
  #panneauValidation .val-crit-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
  [data-theme="dark"] #panneauValidation .val-crit{background:#3a2b18;border-color:#6a4a24}
  /* §14.6 — panneau de consentement cloud. */
  #panneauConsentement{padding:10px 12px;background:#fdf6ec;border-bottom:1px solid #e0b57a;font-size:13px;line-height:1.5}
  #panneauConsentement .cons-act{display:flex;gap:8px;margin-top:8px}
  [data-theme="dark"] #panneauConsentement{background:#3a2b18;border-color:#6a4a24}
  .navflip{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:34px;height:46px;
    border:1px solid var(--bord);background:rgba(255,253,248,.9);color:var(--vert);border-radius:8px;
    font-size:22px;line-height:1;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.12)}
  .navflip:hover{background:#fff}
  .navflip-g{left:8px}
  .navflip-d{right:8px}
  .box{position:absolute;border:1px solid rgba(90,114,96,.35);border-radius:2px;cursor:pointer}
  .box:hover{background:rgba(90,114,96,.12)}
  .box.actif{background:var(--surlig);border-color:var(--ambre)}
  .onglets{display:flex;gap:6px;margin-bottom:10px}
  .onglets button{padding:4px 10px;border-radius:999px;font-size:12px}
  .onglets button.actif{background:var(--vert);color:#fff;border-color:var(--vert)}
  .lignes{display:flex;flex-direction:column;gap:1px;font-family:"Cascadia Code",Consolas,monospace}
  .lg{display:grid;grid-template-columns:2.1rem 1fr auto auto auto auto;gap:6px;align-items:center;padding:1px 5px;border-radius:6px;transition:background .12s}
  .lg:hover{background:rgba(154,90,42,.055)}
  .lg .num{font-size:10px;color:#b0a488;text-align:right}
  .lg input{width:100%;font-family:inherit;font-size:13px;line-height:1.5;border:1px solid transparent;border-radius:5px;background:#fff;padding:4px 7px;transition:border-color .12s,background .12s}
  .lg input:focus{border-color:var(--ambre);outline:none;background:var(--surface)}
  .lg.actif input{background:#fbf4ea}
  .lg.doute input{border-left:2px solid var(--ambre)}
  .lg.doute .num{color:var(--ambre);font-weight:700}
  /* Titre de structure éditoriale (Livre, Prose, Mètre…) → alimente ref_niv1..5. */
  .lg select.niv{font-size:10px;color:var(--second);border:1px solid transparent;border-radius:4px;background:transparent;align-self:center;padding:2px 3px;opacity:.5;transition:opacity .12s,border-color .12s,background .12s}
  .lg:hover select.niv,.lg select.niv:focus{opacity:1;border-color:var(--bord);background:var(--surface)}
  .lg.titre input{border-left:3px solid var(--ambre);font-weight:700;color:#5a4a2a;background:#fdf9f0}
  /* Lecture incertaine : exclue du banc / ground-truth tant qu'elle n'est pas tranchée. */
  .lg .inc{font-size:11px;line-height:1;border:1px solid transparent;border-radius:4px;background:transparent;color:#c8b8a0;align-self:center;cursor:pointer;padding:2px 5px;opacity:.5;transition:opacity .12s,border-color .12s,background .12s}
  .lg:hover .inc{opacity:1}
  .lg .inc:hover{border-color:var(--bord);background:var(--surface)}
  .lg .inc.on{opacity:1;background:#fbeee0;color:#b26a1a;border-color:#e0b57a}
  .lg.incertain input{border-left:2px dashed #c8862a;background:#fdf6ec}
  /* Ligne validée humainement (bonne pour le banc / l'entraînement). */
  .lg.valide .num{color:var(--vert);font-weight:700}
  .lg.valide input{background:#f3f8f3}
  /* Ligne AJOUTÉE à la main (texte que l'OCR n'a pas capté) : sans image, hors entraînement. */
  .lg.ajout input{border-left:3px solid var(--vert);background:#f4f9f4}
  .lg .inc.sup{color:#b5482a;opacity:1}
  .lg .inc.sup:hover{border-color:#e0a890;background:#fbeee8}
  .ajout-barre{display:flex;justify-content:flex-end;padding:1px 5px 5px}
  .ajout-barre button{font-size:11px;opacity:.6;transition:opacity .12s}
  .ajout-barre:hover button,.ajout-barre button:focus{opacity:1}
  /* Suggestion de structure (§ GPT) : rôle proposé, à confirmer. Pastille lisible. */
  .lg .sugg{font-size:9px;line-height:1.25;border:1px solid var(--bord);border-radius:999px;background:var(--surface);color:var(--second);align-self:center;cursor:pointer;padding:2px 8px;white-space:nowrap;max-width:12rem;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
  .lg .sugg:hover{border-color:var(--second)}
  .lg .sugg.ok{background:var(--vertf);color:var(--vert);border-color:var(--vert);font-weight:700}
  select.sugg.lettr,.lg .sugg.lettr{background:#fbeee0;color:#b26a1a;border-color:#e0b57a}
  /* Ligne hors-corps CONFIRMÉE : exclue du corps éditorial (jamais de la source). */
  .lg.horscorps input{opacity:.5;text-decoration:line-through;background:#f3efe6}
  /* Titre courant / n° de page détecté : exclu de l'export, signalé ici. */
  .lg.entete input{color:var(--second);font-style:italic;text-decoration:line-through;opacity:.65;background:#f3efe6}
  .lg .tagtc{font-size:9px;color:var(--second);align-self:center;white-space:nowrap;padding:1px 5px;border:1px solid transparent;border-radius:4px;background:transparent;cursor:pointer}
  .lg:hover .tagtc{border-color:var(--bord)}
  .lg .tagtc:hover{background:var(--surface);color:var(--vert)}
  .paire{display:grid;grid-template-columns:2.4rem 1fr 1fr;gap:8px;align-items:start;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--bord)}
  .paire .pnum{font-size:11px;color:var(--ambre);font-weight:700;text-align:right;padding-top:6px}
  .paire textarea{width:100%;min-height:3.4em;border:1px solid var(--bord);border-radius:5px;padding:6px;font:inherit;font-size:13px;background:#fff;resize:vertical;box-sizing:border-box}
  .paire .pla{font-style:italic;color:#3a4a3f;background:#fbfaf4}
  .bihead{font-size:12px;color:var(--second);margin-bottom:10px}
  .vide{color:var(--second);font-style:italic;padding:20px}
  .barre2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 20px;border-bottom:1px solid var(--bord);background:var(--surface)}
  #drop{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;
    background:rgba(90,114,96,.14);border:3px dashed var(--vert);color:var(--vert);
    font-family:Georgia,serif;font-size:22px;pointer-events:none}
  /* Voile de chargement : fige l'écran pendant l'analyse (capte les clics). */
  #chargement{position:fixed;inset:0;z-index:10000;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;background:rgba(247,243,234,.72)}
  .spin{width:44px;height:44px;border:4px solid var(--bord);border-top-color:var(--vert);
    border-radius:50%;animation:tourne .8s linear infinite}
  @keyframes tourne{to{transform:rotate(360deg)}}
  #chargeTexte{font-family:Georgia,serif;color:var(--second);font-size:15px}
  .pchk{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--second)}
  #comparateur{position:fixed;inset:0;z-index:10001;display:none;background:rgba(43,38,32,.55);padding:24px;overflow:auto}
  .comp-boite{max-width:1100px;margin:0 auto;background:var(--fond);border-radius:10px;padding:18px}
  .comp-barre{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .comp-grille{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .comp-tete{font-size:12px;color:var(--second);margin-bottom:6px;font-weight:600}
  .comp-texte{white-space:pre-wrap;font-family:"Cascadia Code",Consolas,monospace;font-size:12px;background:#fff;border:1px solid var(--bord);border-radius:6px;padding:10px;max-height:60vh;overflow:auto}
  /* Bouton de bascule de thème */
  #theme{border:1px solid var(--bord);background:var(--surface);color:var(--second);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:14px;line-height:1;font-weight:400}

  /* ── MODE SOMBRE ─────────────────────────────────────────────────────────── */
  :root[data-theme="dark"]{
    --fond:#1b1916;--surface:#232019;--encre:#e7e1d5;--second:#a89e8f;--bord:#3a352d;
    --vert:#8fb89b;--vertf:rgba(143,184,155,.16);--ambre:#d68a4a;--surlig:rgba(214,138,74,.34)}
  /* Champs, boutons discrets, listes, zones de texte : fond sombre, texte clair. */
  [data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:#2a2620;color:var(--encre);border-color:var(--bord)}
  [data-theme="dark"] button.discret,[data-theme="dark"] .meta-toggle,[data-theme="dark"] .comp-texte{background:#2a2620;color:var(--second)}
  [data-theme="dark"] .lg select.niv,[data-theme="dark"] .lg .inc{background:transparent}
  [data-theme="dark"] .lg:hover select.niv,[data-theme="dark"] .lg select.niv:focus,[data-theme="dark"] .lg .inc:hover{background:#2a2620}
  [data-theme="dark"] .lg input{background:#211e19;color:var(--encre)}
  [data-theme="dark"] .lg .num{color:#8a8474}
  /* Image du fac-similé : cadre sombre (le scan reste clair, c'est voulu). */
  [data-theme="dark"] #voletImage{background:#12100d}
  [data-theme="dark"] .navflip{background:rgba(35,32,25,.9)}
  [data-theme="dark"] #chargement{background:rgba(18,16,13,.75)}
  [data-theme="dark"] .onglets button.actif{color:#12100d}
  /* Teintes d'état des lignes, en sombre. */
  [data-theme="dark"] .lg.actif input{background:#332c1f}
  [data-theme="dark"] .lg.titre input{background:#2c2517;color:#e8c98a}
  [data-theme="dark"] .lg.incertain input{background:#2e2716}
  [data-theme="dark"] .lg.valide input{background:#1f2a1f}
  [data-theme="dark"] .lg.horscorps input,[data-theme="dark"] .lg.entete input{background:#262320}
  [data-theme="dark"] .lg .inc.on,[data-theme="dark"] .lg .sugg.lettr{background:#3a2b18;color:#e0a860;border-color:#6a4a24}
  [data-theme="dark"] .lg .sugg.ok{background:var(--vertf);color:var(--vert);border-color:var(--vert)}
  [data-theme="dark"] .paire .pla{background:#20221d}
</style>
</head>
<body>
<header>
  <img class="logo" src="/logo-vert-marque.png?v=20260808" alt="La Gueule" />
  <h1>La Gueule · atelier de relecture</h1>
  <label>Nature
    <select id="kind">
      <option value="imprime">imprimé (PDF)</option>
      <option value="manuscrit">manuscrit (image → Kraken)</option>
    </select>
  </label>
  <label>Chemin <input id="chemin" placeholder="D:\\OneDrive\\Bureau\\mon_document.pdf  (ou une image .png)" /></label>
  <button class="discret" id="btnParcourir">Parcourir…</button>
  <input type="file" id="fichierLocal" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff" style="display:none">
  <button class="discret" id="btnAnalyser">Analyser</button>
  <span class="sep"></span>
  <button id="theme" title="Basculer clair / sombre">🌙</button>
  <a href="/index.html" style="font-size:12px;color:var(--second)">panneau ⚙</a>
  <span id="etat">—</span>
</header>

<!-- Pipeline 5 étapes (consignes 2026-08-09) — Phase A : représentation de l'état du parcours. -->
<div id="barreEtapes" title="Parcours : Diagnostic IA → OCR local → Contrôle IA → Validation ciblée → Génération locale"></div>
<div id="panneauValidation" style="display:none"></div>
<div id="panneauConsentement" style="display:none"></div>

<div class="barre2" id="diag" style="display:none;color:var(--ambre)"></div>

<div class="barre2">
  <button class="discret" id="prec">‹ page</button>
  <label>Page <input type="number" id="page" min="1" value="1" /></label>
  <span id="total" style="color:var(--second);font-size:12px"></span>
  <button class="discret" id="suiv">page ›</button>
  <span style="width:12px"></span>
  <label id="lblTypo" style="display:flex;gap:4px;align-items:center">Typo
    <select id="typo" title="Typographie : « ancien » lit le s long (ſ) des imprimés d'Ancien Régime">
      <option value="moderne">moderne · Tesseract</option>
      <option value="ancien">ancien · ſ long — Kraken</option>
    </select>
  </label>
  <label style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="bilingue"> bilingue (en regard)</label>
  <select id="offset"><option value="-1">latin = page préc.</option><option value="1">latin = page suiv.</option></select>
  <button id="ocrPage">OCR cette page</button>
  <span style="width:16px"></span>
  <label>Document de <input type="number" id="de" min="1" value="1" /> à <input type="number" id="a" min="1" value="1" /></label>
  <button id="ocrDoc">OCR document</button>
  <button class="discret" id="stop" disabled>arrêter</button>
</div>

<div class="barre2" id="progression" style="display:none;gap:14px;align-items:center">
  <div style="flex:0 0 220px;height:10px;background:var(--fond);border:1px solid var(--bord);border-radius:6px;overflow:hidden">
    <div id="barreProgFill" style="height:100%;width:0;background:var(--vert);transition:width .25s"></div>
  </div>
  <span id="progTexte" style="font-size:12px;color:var(--second)"></span>
  <span id="progErreurs" style="font-size:12px;color:var(--ambre)"></span>
  <button class="discret" id="btnRelancerErr" style="display:none">Relancer les pages en erreur</button>
</div>

<div class="barre2" id="barrePre" style="gap:10px;flex-wrap:wrap">
  <span style="font-size:12px;color:var(--second);font-weight:600" title="OFF par défaut. À valider par comparaison : un prétraitement n'est utile que s'il améliore l'OCR.">Prétraitement (exp.)</span>
  <label class="pchk"><input type="checkbox" id="p_gris"> gris</label>
  <label class="pchk"><input type="checkbox" id="p_contraste"> contraste</label>
  <label class="pchk"><input type="checkbox" id="p_deskew"> redresser</label>
  <label class="pchk"><input type="checkbox" id="p_binariser"> binariser</label>
  <label class="pchk"><input type="checkbox" id="p_debruiter"> débruiter</label>
  <label class="pchk"><input type="checkbox" id="p_rogner"> rogner marges</label>
  <label class="pchk">demi-page <select id="p_demi"><option value="">—</option><option value="gauche">gauche</option><option value="droite">droite</option></select></label>
  <button class="discret" id="btnComparer">Comparer cette page</button>

<script>
const $=id=>document.getElementById(id)
const api=async(u,o)=>{const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.erreur||r.statusText);return j}
// Thème clair/sombre : préférence enregistrée, sinon celle du système.
function appliquerTheme(t){ document.documentElement.setAttribute('data-theme',t); const b=$('theme'); if(b) b.textContent = t==='dark'?'☀️':'🌙' }
(function(){ const stored=localStorage.getItem('lg-theme')
  const dark = stored ? stored==='dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
  appliquerTheme(dark?'dark':'light') })()
window.addEventListener('DOMContentLoaded',()=>{ const b=$('theme'); if(!b) return
  appliquerTheme(document.documentElement.getAttribute('data-theme')||'light')
  b.onclick=()=>{ const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; localStorage.setItem('lg-theme',t); appliquerTheme(t) } })
const etat=t=>$('etat').textContent=t

// Modèle en mémoire : pages[n] = { pngUrl, largeur, hauteur, lignes:[{bbox,dip,dev,mod}] }
const S={ kind:'imprime', pages:{}, page:1, total:null, couche:'dip', arret:false, journal:[], garde:null, workflow:null }

// ── Pipeline 5 étapes (Phase A) : barre visuelle persistante de l'état du parcours ──
const ETAPES_UI=[['diagnostic_ia','1','Diagnostic IA'],['ocr_local','2','OCR local'],['controle_ia','3','Contrôle IA'],['validation_ciblee','4','Validation ciblée'],['generation_locale','5','Génération locale']]
const LIB_ETAT={non_commence:'non commencé',pret:'prêt',en_cours:'en cours',termine:'terminé',a_verifier:'à vérifier',bloque:'bloqué',erreur:'erreur',perime:'périmé'}
function rendreBarreEtapes(){ const bar=$('barreEtapes'); if(!bar)return; const wf=S.workflow; bar.innerHTML=''
  for(const [cle,num,lib] of ETAPES_UI){ const et=(wf&&wf.etapes&&wf.etapes[cle]&&wf.etapes[cle].etat)||'non_commence'
    const d=document.createElement('div'); d.className='etape'+(wf&&wf.etape_active===cle?' active':'')
    const n=document.createElement('span'); n.className='num'; n.textContent='ÉTAPE '+num
    const l=document.createElement('span'); l.className='lib'; l.textContent=lib
    const b=document.createElement('span'); b.className='badge '+et; let libEt=LIB_ETAT[et]||et
    if(cle==='ocr_local'&&wf&&wf.etapes.ocr_local&&wf.etapes.ocr_local.resume){ const rz=wf.etapes.ocr_local.resume; if(rz.manquantes>0) libEt+=' · '+rz.manquantes+' manquante(s)'; else if(rz.total) libEt+=' · '+rz.faites+'/'+rz.total }
    b.textContent=libEt
    d.appendChild(n); d.appendChild(l); d.appendChild(b)
    if(cle==='diagnostic_ia'){ d.style.cursor='pointer'; d.title='Refaire le diagnostic (page de titre + typographie → profil de traitement)'; d.onclick=()=>{ if($('chemin').value.trim()) analyser() } }
    if(cle==='controle_ia'){ d.style.cursor='pointer'; d.title='Lancer le contrôle déterministe (confiance, lignes vides, doublons, pages anormales)'; d.onclick=()=>lancerControle() }
    if(cle==='validation_ciblee'){ d.style.cursor='pointer'; d.title='Validation ciblée : familles à échantillonner, cas critiques, blocages'; d.onclick=()=>lancerValidation() }
    if(cle==='generation_locale'){ d.style.cursor='pointer'; d.title='Générer les livrables (JSON/DOCX/TXT/MD/SQL/ALTO/PAGE) + rapport de provenance'; d.onclick=()=>lancerGeneration() }
    bar.appendChild(d) } }
rendreBarreEtapes(); setTimeout(()=>{ try{ chargerEtatIA() }catch{} }, 0) // §14.6 : état du fournisseur au démarrage

// Phase B — met à jour une étape du workflow côté client (miroir de workflow.mjs).
function majEtapeClient(cle, patch, active){ if(!S.workflow) S.workflow={version_schema:1, etape_active:'diagnostic_ia', etapes:{}}
  for(const [c] of ETAPES_UI) if(!S.workflow.etapes[c]) S.workflow.etapes[c]={etat:'non_commence'}
  Object.assign(S.workflow.etapes[cle], patch||{}); if(active) S.workflow.etape_active=active; rendreBarreEtapes() }

// Profil de traitement proposé par le diagnostic (l'IA propose, n'impose pas ; prétraitement inactif).
function construireProfilClient(meta, typo, nbPages){ const anc=!!(typo&&typo.ancien)
  const lg=meta&&meta.langue_trad?[String(meta.langue_trad).toLowerCase().slice(0,2)]:[]
  return { document:{ type:anc?'imprime_ancien':'imprime_moderne', langues:lg, periode_probable:null, qualite_scan:'inconnue' },
    regimes:[{ pages_pdf:[1, nbPages||1], nature:'corps', moteur:anc?'kraken':'tesseract', modele:anc?'CATMuS-Print':null, colonnes:1 }],
    pretraitement:{ actif:false, tests_recommandes:[] },
    phenomenes:{ lettrines:true, poesie:true, notes:false, titres_courants:true, reclames:true, marques_cahier:true },
    controles_requis:[] } }

async function finaliserDiagnostic({ nbPages, meta, typographie, manuscrit }){
  const profil = manuscrit
    ? { document:{type:'manuscrit',langues:[],periode_probable:null,qualite_scan:'inconnue'}, regimes:[{pages_pdf:[1,1],nature:'corps',moteur:'kraken',modele:'CATMuS Medieval',colonnes:1}], pretraitement:{actif:false,tests_recommandes:[]}, phenomenes:{}, controles_requis:[] }
    : construireProfilClient(meta, typographie, nbPages)
  S.profil=profil
  const nom=$('projet').value.trim(); if(nom){ try{ await api('/api/ia/profil/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nom, profil})}) }catch{} }
  majEtapeClient('diagnostic_ia',{etat:'termine'}); majEtapeClient('ocr_local',{etat:'pret'},'ocr_local'); planifierSave() }

// Phase C — régime (moteur/modèle) de la page selon le profil, sinon null (→ sélecteur Typo).
function regimePourPageClient(n){ if(!S.profil||!Array.isArray(S.profil.regimes))return null
  for(const r of S.profil.regimes){ const a=r.pages_pdf&&r.pages_pdf[0], b=r.pages_pdf&&r.pages_pdf[1]
    if(a!=null&&b!=null&&n>=a&&n<=b) return {moteur:r.moteur||'kraken',modele:r.modele||null,nature:r.nature||'corps'} }
  return null }
function pageAnormaleClient(lignes){ const arr=Array.isArray(lignes)?lignes:[]; const nb=arr.reduce((s,l)=>s+String((l&&(l.dip||l.texte))||'').trim().length,0)
  if(arr.length<1) return 'page vide'; if(nb<8) return 'page anormalement courte ('+nb+' car.)'; return null }
// OCR d'une page → avance le workflow. « OCR local » n'est TERMINÉ que si TOUTES les pages sont
// océrisées ; sinon « en cours » + nombre de pages manquantes (retour utilisateur 2026-08-09).
function apresOcrWorkflow(){
  const total = S.total || Math.max(0, ...Object.keys(S.pages).map(Number).filter(Number.isFinite), 0)
  const faites = Object.keys(S.pages).filter(k=>Array.isArray(S.pages[k].lignes)&&S.pages[k].lignes.length).length
  const manquantes = Math.max(0, (total||0) - faites)
  majEtapeClient('ocr_local',{ etat: manquantes>0?'en_cours':'termine', resume:{ faites, total, manquantes } })
  if(manquantes===0 && S.workflow&&S.workflow.etapes.controle_ia&&S.workflow.etapes.controle_ia.etat==='non_commence') S.workflow.etapes.controle_ia.etat='pret'
  for(const e of ['validation_ciblee','generation_locale']){ const s=S.workflow&&S.workflow.etapes[e]; if(s&&s.etat!=='non_commence'&&s.etat!=='perime') s.etat='perime' }
  rendreBarreEtapes() }

// §14.6 — état du fournisseur IA (sans clé) et consentement.
async function chargerEtatIA(){ try{ S.ia=await api('/api/ia/etat') }catch{ S.ia=null } }
function consentementValideClient(){ const i=S.ia; return !!(i&&i.consentement&&i.consentement.actif&&i.fournisseur&&i.consentement.fournisseur===i.fournisseur.nom&&i.consentement.date) }
function demanderConsentement(){ return new Promise((resolve)=>{ const p=$('panneauConsentement'); if(!p){ resolve(false); return }
  const f=S.ia&&S.ia.fournisseur
  p.style.display='block'; p.innerHTML=''
  const txt=document.createElement('div'); txt.innerHTML=`<b>Contrôle IA cloud (${f?f.nom:'?'})</b> — pour lire les lettrines et les régions douteuses, La Gueule enverrait au fournisseur des <b>crops</b> (petites images) des zones concernées et leurs lignes voisines, <b>jamais le livre entier ni aucun secret du dépôt</b>. La sortie reste un <b>candidat</b>, jamais une validation ; tu peux désactiver à tout moment.`
  p.appendChild(txt)
  const act=document.createElement('div'); act.className='cons-act'
  const oui=document.createElement('button'); oui.textContent='J\'accepte l\'envoi au cloud'
  oui.onclick=async()=>{ try{ await api('/api/ia/consentement',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({actif:true})}) }catch{} await chargerEtatIA(); p.style.display='none'; resolve(true) }
  const non=document.createElement('button'); non.className='discret'; non.textContent='Rester en local (mock)'
  non.onclick=()=>{ p.style.display='none'; resolve(false) }
  act.appendChild(oui); act.appendChild(non); p.appendChild(act) }) }

// Phase D — contrôle : déterministe (toujours) + IA visuel si fournisseur cloud configuré ET consenti.
async function lancerControle(){ if(!Object.keys(S.pages).length){ etat('rien à contrôler : océrise d\'abord'); return }
  await chargerEtatIA()
  if(S.ia && S.ia.fournisseur && S.ia.fournisseur.cloud && S.ia.fournisseur.dispo && !consentementValideClient()){ await demanderConsentement() } // §14.6 : consentement avant tout envoi cloud
  majEtapeClient('controle_ia',{etat:'en_cours'},'controle_ia'); chargeOn('Contrôle…')
  try{ const r=await api('/api/ia/controle',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({projet:projetActuel()})})
    S.controle=r; const c=r.compteurs||{}
    majEtapeClient('controle_ia',{etat:'a_verifier'})
    if(S.workflow&&S.workflow.etapes.validation_ciblee&&S.workflow.etapes.validation_ciblee.etat==='non_commence') majEtapeClient('validation_ciblee',{etat:'pret'})
    const ia=(c.ia||0); const noteIA = ia?(' · '+ia+' avis IA'):((S.ia&&S.ia.fournisseur&&S.ia.fournisseur.cloud)?(consentementValideClient()?' · IA cloud active (aucun avis)':' · IA cloud non consentie'):' · IA locale (mock, abstention)')
    etat(`Contrôle : ${c.pages||0} page(s), ${c.lignes||0} ligne(s) — confiance faible ${c.confiance_faible||0}, vides ${c.lignes_vides||0}, doublons ${c.doublons||0}, pages anormales ${c.pages_anormales||0}${noteIA}.`)
  }catch(e){ majEtapeClient('controle_ia',{etat:'erreur'}); etat('contrôle : '+e.message) }
  finally{ chargeOff() } }

// Phase E — validation CIBLÉE : familles + cas critiques + blocages (tu ne valides pas tout).
async function lancerValidation(){ if(!S.controle||!S.controle.findings){ etat('lance d\'abord le contrôle (étape 3)'); return }
  majEtapeClient('validation_ciblee',{etat:'en_cours'},'validation_ciblee'); chargeOn('Validation ciblée…')
  try{ const r=await api('/api/ia/validation',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({findings:S.controle.findings})})
    S.validation=r; rendrePanneauValidation()
    const bloque=r.blocages.length>0
    majEtapeClient('validation_ciblee',{etat: bloque?'bloque':'a_verifier'})
    if(!bloque && S.workflow&&S.workflow.etapes.generation_locale&&S.workflow.etapes.generation_locale.etat==='non_commence') majEtapeClient('generation_locale',{etat:'pret'})
    etat(`Validation : ${r.compteurs.critiques} critique(s), ${r.compteurs.blocages} blocage(s), ${r.compteurs.familles} famille(s), ${r.compteurs.automatiques} auto — ${bloque?'export « complet » bloqué (provisoire possible avec avertissement)':'prêt pour la génération'}.`)
  }catch(e){ majEtapeClient('validation_ciblee',{etat:'erreur'}); etat('validation : '+e.message) }
  finally{ chargeOff() } }
function rendrePanneauValidation(){ const p=$('panneauValidation'); if(!p)return; const v=S.validation; if(!v){ p.style.display='none'; return }
  p.style.display='block'; p.innerHTML=''; const c=v.compteurs
  const tete=document.createElement('div'); tete.className='val-tete'
  const info=document.createElement('span'); info.innerHTML=`<b>Validation ciblée</b> — critiques ${c.critiques} · blocages ${c.blocages} · familles ${c.familles} · auto ${c.automatiques} · non résolus ${c.non_resolus}`
  const fermer=document.createElement('button'); fermer.className='discret'; fermer.textContent='fermer'; fermer.onclick=()=>{ p.style.display='none' }
  tete.appendChild(info); tete.appendChild(fermer); p.appendChild(tete)
  for(const fam of v.familles){ const d=document.createElement('div'); d.className='val-fam'
    const s=document.createElement('span'); s.textContent=`${fam.cle} — ${fam.nb} occurrence(s), risque ${fam.risque}`
    const b=document.createElement('button'); b.className='discret'; b.textContent='Accepter la famille'
    b.title='Applique la famille dans la couche candidate (statut accepté par échantillonnage ; PAS du ground-truth).'
    b.onclick=()=>accepterFamille(fam.cle)
    d.appendChild(s); d.appendChild(b); p.appendChild(d) }
  // §11.4/§13.6 — cas CRITIQUES présentés individuellement (avant → après, règle, risque, décision).
  for(const f of v.critiques){ const d=document.createElement('div'); d.className='val-crit'
    const t=document.createElement('div'); t.className='val-crit-tete'
    t.textContent=`⚠ ${f.regle||f.id||'cas'} · ${f.niveau_risque} · page ${f.page??'?'}${(f.ligne_ids&&f.ligne_ids.length)?' l'+f.ligne_ids.join(','):''}`
    d.appendChild(t)
    if(f.texte_original!=null||f.texte_candidat!=null){ const av=document.createElement('div'); av.className='val-avapr'
      av.innerHTML=`<span class="av">${(f.texte_original||'∅').replace(/</g,'&lt;')}</span> → <span class="apr">${(f.texte_candidat||'∅').replace(/</g,'&lt;')}</span>`; d.appendChild(av) }
    const act=document.createElement('div'); act.className='val-crit-act'
    for(const [lib,st] of [['Accepter','confirme_humain'],['Modifier','modifie_humain'],['Refuser','refuse'],['Indéterminé','indetermine']]){
      const bt=document.createElement('button'); bt.className='discret'; bt.textContent=lib
      bt.onclick=()=>decisionCritique(f, st); act.appendChild(bt) }
    // voir le crop (image de la page + bbox) si disponible
    if(Array.isArray(f.bbox)&&f.page!=null&&S.pages[f.page]&&S.pages[f.page].pngUrl){ const z=document.createElement('button'); z.className='discret'; z.textContent='🔍 voir'
      z.onclick=()=>{ const pg=S.pages[f.page]; const save=S.page; S.page=f.page; zoomRegion(f.bbox); S.page=save }; act.appendChild(z) }
    d.appendChild(act); p.appendChild(d) }
  if(v.blocages.length){ const bl=document.createElement('div'); bl.className='val-bloc'; bl.textContent='⛔ '+v.blocages.length+' blocage(s) — export « complet » impossible tant qu\'ils ne sont pas levés.'; p.appendChild(bl) } }
// Décision humaine sur un cas critique : met à jour le finding source + recompte. Seuls confirme/modifie
// humain ouvrent le ground-truth (§11.7) — appliqué ailleurs à l'écriture ; ici on trace la décision.
function decisionCritique(f, statut){ if(!S.controle||!S.controle.findings)return
  const memeFinding=(g)=>((g.regle||g.id)===(f.regle||f.id))&&g.page===f.page&&JSON.stringify(g.ligne_ids||[])===JSON.stringify(f.ligne_ids||[])
  S.controle.findings.forEach(g=>{ if(memeFinding(g)){ g.statut=statut; if(statut==='modifie_humain'){ const m=window.prompt('Texte corrigé :', g.texte_candidat||g.texte_original||''); if(m!=null) g.texte_candidat=m } } })
  lancerValidation() }
function accepterFamille(cle){ if(S.controle&&S.controle.findings) S.controle.findings.forEach(f=>{ if((f.regle||f.id||f.type)===cle && f.statut==='propose_ia') f.statut='accepte_echantillonnage' })
  lancerValidation() } // recompte : la famille passe des « familles » aux « automatiques »

// Phase F — génération LOCALE : livrables (exports existants) + état de livraison + rapport. AUCUNE IA.
async function lancerGeneration(){ const nom=$('projet').value.trim(); if(!nom){ etat('nomme le projet d\'abord'); return }
  if(!Object.keys(S.pages).length){ etat('rien à générer : océrise d\'abord'); return }
  majEtapeClient('generation_locale',{etat:'en_cours'},'generation_locale'); chargeOn('Génération locale…')
  try{ const fichiers=[]
    try{ await api('/api/export',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nom,projet:projetActuel(),id_oeuvre:($('idoeuvre')&&$('idoeuvre').value.trim())||null,recenserNotes:$('chkNotes')&&$('chkNotes').checked})}); fichiers.push('json','docx','sql','txt','md') }catch(e){}
    try{ const rx=await api('/api/export/xml',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nom,projet:projetActuel(),couche:S.couche})}); if(rx&&rx.nbPages) fichiers.push('alto','page') }catch(e){}
    const run_id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('run-'+Date.now()); const date=new Date().toISOString()
    const g=await api('/api/ia/generation',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nom,projet:projetActuel(),validation:S.validation||{},profil:S.profil||null,run_id,date,fichiers})})
    majEtapeClient('generation_locale',{etat:'termine',run_id})
    etat(`Génération : ${g.etat} — ${fichiers.length} type(s) de fichier dans exports/. Rapport : ${(g.chemin||'').split(/[\\/]/).pop()}.${g.etat!=='FINAL_CANDIDAT'?' Livraison PROVISOIRE (voir réserves / blocages).':''}`)
  }catch(e){ majEtapeClient('generation_locale',{etat:'erreur'}); etat('génération : '+e.message) }
  finally{ chargeOff() } }
const SEUIL_DOUTE=0.80 // en dessous, la ligne est signalée « à revoir »

// ── Fiabilité des lots : état par page (à faire / terminé / erreur), progression, journal ────
function marquerEtat(n, etat, msg){ if(!S.pages[n]) S.pages[n]={}; S.pages[n].etat=etat
  if(etat==='erreur') S.pages[n].erreur=String(msg||'').slice(0,300); else delete S.pages[n].erreur }
function journaliser(n, msg){ (S.journal||(S.journal=[])).push({page:n, message:String(msg).slice(0,200), at:new Date().toISOString()})
  if(S.journal.length>1000) S.journal=S.journal.slice(-1000) }
function pagesEnErreur(){ return Object.keys(S.pages).map(Number).filter(n=>S.pages[n]?.etat==='erreur').sort((a,b)=>a-b) }
function pagesATraiter(de,a){ const l=[]; for(let n=de;n<=a;n++) if(S.pages[n]?.etat!=='termine') l.push(n); return l } // saute les faites → reprise
function compterEtats(de,a){ let fait=0,err=0,tot=0; for(let n=de;n<=a;n++){ tot++; const e=S.pages[n]?.etat; if(e==='termine')fait++; else if(e==='erreur')err++ } return {fait,err,tot} }
function majProgres(de,a){ const {fait,err,tot}=compterEtats(de,a); $('progression').style.display='flex'
  $('barreProgFill').style.width=(tot?Math.round(fait/tot*100):0)+'%'
  $('progTexte').textContent=`${fait}/${tot} pages · ${err} erreur${err>1?'s':''}`
  const pe=pagesEnErreur(); $('btnRelancerErr').style.display=pe.length?'inline-block':'none'
  $('progErreurs').textContent=pe.length?('en erreur : '+pe.slice(0,25).join(', ')+(pe.length>25?'…':'')):'' }
function assurerNomProjet(){ if($('projet').value.trim())return // un lot est TOUJOURS persisté : on nomme d'office
  const c=$('chemin').value.trim(); const b=(c.split(/[\\/]/).pop()||'ouvrage').replace(/\.[^.]+$/,'').replace(/[^\w.-]+/g,'_').slice(0,60)
  $('projet').value=b||'ouvrage' }

$('kind').onchange=()=>{ S.kind=$('kind').value; document.querySelector('.barre2').style.opacity=1
  $('onglets').style.display=(S.kind==='manuscrit')?'flex':'none'
  $('lblTypo').style.display=(S.kind==='imprime')?'flex':'none' // choix du moteur : imprimé seulement
  // imprimé = un seul texte ; on force l'onglet diplomatique (= le texte OCR)
  if(S.kind!=='manuscrit'){S.couche='dip'} rendre() }

// Voile de chargement : fige l'écran (le voile capte les clics) pendant une opération longue.
const chargeOn=(t)=>{ $('chargeTexte').textContent=t||'Analyse…'; $('chargement').style.display='flex' }
const chargeOff=()=>{ $('chargement').style.display='none' }

async function analyser(){
  const chemin=$('chemin').value.trim(); if(!chemin)return
  chargeOn('Analyse du document…')
  try{
    if(S.kind==='imprime'){
      const {pages}=await api('/api/pdf-info?path='+encodeURIComponent(chemin)); S.total=pages
      $('total').textContent=pages?`/ ${pages}`:''; $('a').value=Math.min(pages||1,($('de').valueAsNumber||1)+9)
      // Analyse LÉGÈRE au dépôt (rapide) : page de titre + sonde de typographie, PAS d'OCR du document.
      chargeOn('Analyse rapide (page de titre + typographie)…')
      const r=await api('/api/metadonnees',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path:chemin, rapide:true})})
      remplirMeta(r.meta, true); $('main').classList.remove('meta-replie'); $('metaToggle').textContent='‹'; planifierSave()
      // Choix AUTOMATIQUE du moteur adapté à ce livre (imprimé ancien à s long → Kraken).
      const anc=r.typographie?.ancien; $('typo').value=anc?'ancien':'moderne'
      await finaliserDiagnostic({ nbPages:pages, meta:r.meta, typographie:r.typographie }) // Phase B : profil + avance du workflow
      etat(`PDF : ${pages} pages — diagnostic fait. Moteur conseillé : ${anc?'imprimé ANCIEN (s long → Kraken)':'moderne (Tesseract)'} — ${r.typographie?.raison||''}. Étape suivante : « OCR local » (« OCR cette page » / « OCR document »).`)
    } else {
      S.total=1; $('total').textContent=''; await finaliserDiagnostic({ nbPages:1, manuscrit:true }); etat('image (manuscrit) prête — moteur Kraken CATMuS Medieval. Étape suivante : « OCR cette page ».')
    }
  }catch(e){ etat('erreur : '+e.message) }
  finally{ chargeOff() }
}

async function ocr(n){
  const chemin=$('chemin').value.trim(); if(!chemin)throw new Error('chemin manquant')
  if(S.kind==='imprime' && $('bilingue').checked){
    const r=await api('/api/atelier/ocr-bilingue',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({pdfWin:chemin,page:n,offset:Number($('offset').value),dpi:300})})
    S.pages[n]={ pngUrl:r.pngUrl, largeur:r.largeur, hauteur:r.hauteur, bilingue:true, ocr:r.ocr,
      langueFr:r.langueFr, langueLa:r.langueLa,
      lignes:(r.lignesFr||[]).map(l=>({bbox:l.bbox, dip:l.texte})),
      paires:(r.paires||[]).map(p=>({paragraphe:p.paragraphe, fr:p.fr, la:p.la})) }
    apresOcrWorkflow() // Phase C : OCR local → workflow
    return S.pages[n]
  }
  // Phase C — moteur/modèle selon le RÉGIME de la page (profil du diagnostic), sinon le sélecteur Typo.
  const reg=regimePourPageClient(n)
  const ancien = reg ? (reg.moteur==='kraken') : ($('typo') && $('typo').value==='ancien') // imprimé ancien → Kraken CATMuS-Print
  const pre=$('p_utiliser')&&$('p_utiliser').checked ? collecterPretraitement() : null // OFF par défaut
  const corps=S.kind==='imprime'
    ? {kind:'imprime',pdfWin:chemin,page:n,dpi:300,lang:'fra',moteur:ancien?'kraken-print':'tesseract',pretraitement:pre}
    : {kind:'manuscrit',imageWin:chemin}
  const r=await api('/api/atelier/ocr',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(corps)})
  S.pages[n]={ pngUrl:r.pngUrl, largeur:r.largeur, hauteur:r.hauteur, ocr:r.ocr,
    lignes:(r.lignes||[]).map(l=>({bbox:l.bbox, confiance:l.confiance, ocr0:l.texte, dip:l.texte, dev:l.texte, mod:''})) }
  const anom=pageAnormaleClient(S.pages[n].lignes); if(anom){ S.pages[n].anomalie=anom } else { delete S.pages[n].anomalie } // §7.2 : signaler page vide/courte
  apresOcrWorkflow() // Phase C : OCR local → workflow
  return S.pages[n]
}

// Titre courant / n° de page — mêmes règles qu'à l'export (projet.mjs::estEntete). Conservateur.
function estEnteteC(t){ const s=(t||'').trim()
  if(!s) return true
  if(/^[_—–\-\s.]*\d{1,4}[_—–\-\s.]*$/.test(s)) return true
  if(/^\d{0,4}\s*[A-ZÀ-Þ][A-ZÀ-Þ'’ .-]{2,24}\d{0,4}$/.test(s)) return true
  if(/digitized by google/i.test(s)) return true
  return false
}

// ── Passe 3 : miroirs CLIENT des fonctions pures (structure.mjs / projet.mjs) ──
// Q1 — provenance d'une correction de lettrine (omission_ocr vs restitution_editoriale).
function corrigerLettrineClient({ texte_ocr='', texte_valide, visible }){
  const restitution = visible===false
  const a={ type_correction: restitution?'restitution_editoriale':'omission_ocr', nature:'lettrine',
    texte_ocr:String(texte_ocr||''), texte_valide:String(texte_valide||''), visible_dans_source:!restitution,
    origine_lecture: restitution?'conjecture':'image', validation:'humaine', certitude: restitution?'probable':'certaine',
    bbox_source:null, restitution_editoriale:restitution, afficher_marque_critique:restitution }
  if(restitution) a.interdit_entrainement=true
  return a
}
function appliquerCorrectionLettrine(l, s, texte_valide, visible){
  const actuel=String(l.dip||'')
  s.correction = corrigerLettrineClient({ texte_ocr: l.ocr0!=null?l.ocr0:actuel, texte_valide, visible })
  l.dip = String(texte_valide||'') + actuel  // initiale intégrée en tête, SANS crochets
  s.role_confirme='lettrine'; s.statut='confirme'; l.incertain=false
  if(!visible) l.interdit_entrainement=true   // restitution conjecturale → hors ground-truth
}
function saisirInitiale(l, s, visible){
  const init = window.prompt(visible ? 'Initiale VISIBLE dans l’image, à saisir (ex. M, L’) :'
                                     : 'Initiale ILLISIBLE, restitution conjecturale (ex. M) :', '')
  if(init==null){ rendre(); return }        // annulé → aucune modification
  appliquerCorrectionLettrine(l, s, init, visible); planifierSave(); rendre()
}
// Q2 — suggestion de césure (jamais de conversion silencieuse).
function suggererCesureClient(a, b){ a=String(a||'').trim(); b=String(b||'').trim()
  if(!/[-‐]$/.test(a)) return false; return /^[a-zà-öø-ÿ]/.test(b) }
function appliquerCesure(l){ l.dip=String(l.dip||'').replace(/[-‐]\s*$/, '¬')
  l.cesure={ type:'coupure_typographique_fin_ligne', marque_ground_truth:'¬', glyphe_source:'-', jointure_confirmee:true, validation:'humaine', ambigu:false }
  planifierSave(); rendre() }
// Q1 — zoom sur la région probable d'une lettrine (bbox + marge + lignes voisines dessous).
function zoomRegion(bbox){ const pg=S.pages[S.page]; if(!pg||!pg.pngUrl||!Array.isArray(bbox))return
  const [x,y,w,h]=bbox, W=pg.largeur||1, H=pg.hauteur||1
  let ov=document.getElementById('zoomOverlay')
  if(!ov){ ov=document.createElement('div'); ov.id='zoomOverlay'; ov.onclick=()=>ov.remove(); document.body.appendChild(ov) }
  ov.innerHTML=''
  const mx=w*0.6, my=h*2.4
  const zx=Math.max(0,x-mx), zy=Math.max(0,y-h*0.3), zw=Math.min(W-zx,w+2*mx), zh=Math.min(H-zy,h+my)
  const ech=Math.min(560/zw, 460/zh)
  const box=document.createElement('div'); box.className='zoombox'
  box.style.width=Math.round(zw*ech)+'px'; box.style.height=Math.round(zh*ech)+'px'
  box.style.backgroundImage='url("'+pg.pngUrl+'")'
  box.style.backgroundSize=Math.round(W*ech)+'px '+Math.round(H*ech)+'px'
  box.style.backgroundPosition='-'+Math.round(zx*ech)+'px -'+Math.round(zy*ech)+'px'
  ov.appendChild(box)
}

function rendre(){
  const pg=S.pages[S.page]
  const holder=$('imgHolder'), vl=$('lignes')
  const multiPages=(S.kind==='imprime')||((S.total||1)>1) // un PDF a toujours des pages
  $('navPrec').style.display=$('navSuiv').style.display=multiPages?'block':'none'
  // Page sans image ni lignes exploitables (jamais océrisée, ou OCR en erreur) : message propre,
  // pas d'image cassée ni de plantage (pg.lignes serait undefined plus bas).
  if(!pg || !pg.pngUrl || !Array.isArray(pg.lignes)){
    const d=document.createElement('div'); d.className='vide'
    d.textContent=(pg && pg.etat==='erreur')
      ? ('Page en échec d\'OCR : '+(pg.erreur||'cause inconnue')+' — relance « OCR cette page » pour réessayer.')
      : 'Pas encore d\'OCR pour cette page.'
    holder.innerHTML=''; holder.appendChild(d); vl.innerHTML='<div class="vide">—</div>'; return
  }
  // Image + boîtes. L'image est mise à l'échelle pour TENIR dans la hauteur du volet (pas de défilement).
  holder.innerHTML=''
  const scene=document.createElement('div'); scene.className='scene'
  const img=document.createElement('img'); img.src=pg.pngUrl
  scene.appendChild(img); holder.appendChild(scene)
  img.onload=()=>{ const dispo=$('voletImage').clientHeight-24; if(dispo>120) img.style.maxHeight=dispo+'px'
    const sx=img.clientWidth/pg.largeur, sy=img.clientHeight/pg.hauteur
    pg.lignes.forEach((l,i)=>{ if(!l.bbox)return; const [x,y,w,h]=l.bbox
      const b=document.createElement('div'); b.className='box'; b.dataset.i=i
      b.style.left=(x*sx)+'px'; b.style.top=(y*sy)+'px'; b.style.width=(w*sx)+'px'; b.style.height=(h*sy)+'px'
      b.onclick=()=>{ const inp=vl.querySelector(`input[data-i="${i}"]`); if(inp){inp.focus();} }
      scene.appendChild(b) }) }
  // Bilingue : paragraphes appariés (n° | français | latin), éditables.
  if(pg.bilingue){
    vl.innerHTML=''
    const h=document.createElement('div'); h.className='bihead'
    h.textContent=`Bilingue — page: ${pg.langueFr}, en regard: ${pg.langueLa} · ${pg.paires.length} paragraphes appariés`
    vl.appendChild(h)
    pg.paires.forEach((pr,i)=>{
      const row=document.createElement('div'); row.className='paire'
      const num=document.createElement('div'); num.className='pnum'; num.textContent=(pr.paragraphe!=null)?pr.paragraphe:('¶'+(i+1))
      const fr=document.createElement('textarea'); fr.className='pfr'; fr.value=pr.fr||''; fr.oninput=()=>{pr.fr=fr.value; planifierSave()}
      const la=document.createElement('textarea'); la.className='pla'; la.value=pr.la||''; la.oninput=()=>{pr.la=la.value; planifierSave()}
      row.appendChild(num); row.appendChild(fr); row.appendChild(la); vl.appendChild(row)
    })
    return
  }
  // Repérage des titres courants : ligne du HAUT et du BAS (mêmes règles qu'à l'export).
  const avec=pg.lignes.map((l,i)=>({l,i})).filter(x=>Array.isArray(x.l.bbox))
  let topI=-1, botI=-1
  if(avec.length){
    topI=avec.reduce((a,b)=> b.l.bbox[1]<a.l.bbox[1]?b:a).i
    botI=avec.reduce((a,b)=> (b.l.bbox[1]+b.l.bbox[3])>(a.l.bbox[1]+a.l.bbox[3])?b:a).i
  }
  // Texte de la couche courante, éditable
  vl.innerHTML=''
  // Ajout manuel d'une ligne que l'OCR a ratée (folio, réclame, ligne de corps oubliée).
  const barreAjout=document.createElement('div'); barreAjout.className='ajout-barre'
  const bAjout=document.createElement('button'); bAjout.type='button'; bAjout.className='discret'; bAjout.textContent='＋ ligne manquante'
  bAjout.title='Ajoute une ligne que l\'OCR n\'a pas captée. Insérée après la ligne sélectionnée (sinon en tête). À corriger, classer (numéro de page…) et valider. Sans image associée : comptée dans l\'évaluation du banc, mais hors entraînement.'
  bAjout.onclick=()=>{ const act=vl.querySelector('.lg.actif'); insererLigne(act?(+act.dataset.i+1):0) }
  barreAjout.appendChild(bAjout); vl.appendChild(barreAjout)
  pg.lignes.forEach((l,i)=>{ const row=document.createElement('div'); row.className='lg'; row.dataset.i=i
    const txt=l[S.couche]||''
    const doute=(l.confiance!=null && l.confiance<SEUIL_DOUTE)
    const estTitre=!!(l.titre && l.titre.niveau)
    const entete=!estTitre && (i===topI||i===botI) && !l.force_corps && estEnteteC(txt) // force_corps = restauré à la main
    if(doute) row.classList.add('doute')
    if(entete) row.classList.add('entete')
    if(estTitre) row.classList.add('titre')
    if(l.incertain) row.classList.add('incertain')
    if(l.valide_humain && !l.incertain) row.classList.add('valide')
    if(l.ajout_humain) row.classList.add('ajout')
    const num=document.createElement('div'); num.className='num'; num.textContent=i+1
    if(doute) num.title='à revoir (confiance '+Math.round(l.confiance*100)+' %)'
    const inp=document.createElement('input'); inp.dataset.i=i; inp.value=txt
    inp.oninput=()=>{ l[S.couche]=inp.value; if(l.titre) l.titre.texte=inp.value; planifierSave() }
    inp.onfocus=()=>{ document.querySelectorAll('.box.actif,.lg.actif').forEach(e=>e.classList.remove('actif'))
      row.classList.add('actif'); const box=$('voletImage').querySelector(`.box[data-i="${i}"]`)
      if(box){box.classList.add('actif'); box.scrollIntoView({block:'center',behavior:'smooth'})} }
    row.appendChild(num); row.appendChild(inp)
    if(entete){ const tag=document.createElement('button'); tag.type='button'; tag.className='tagtc'; tag.textContent='titre courant ↩'
      tag.title='Barré comme titre courant / n° de page (exclu de l\'export). Clic = RESTAURER en corps (par ex. une ligne du titre de la page de titre prise à tort pour un titre courant).'
      tag.onclick=()=>{ l.force_corps=true; if(l.suggestion&&(l.suggestion.role_confirme==='titre_courant'||l.suggestion.role_confirme==='numero_page')){ l.suggestion.role_confirme=null; l.suggestion.statut='suggere'; l.suggestion.export_corps=true } planifierSave(); rendre() }
      row.appendChild(tag) }
    // Sélecteur de niveau de titre : « — » (texte courant) ou Titre 1..5 (Livre, Prose…).
    const niv=document.createElement('select'); niv.className='niv'; niv.title='Marquer cette ligne comme titre de structure (ref_niv). « — » = texte normal.'
    niv.innerHTML='<option value="0">—</option>'+[1,2,3,4,5].map(k=>`<option value="${k}">T${k}</option>`).join('')
    niv.value=String(estTitre?l.titre.niveau:0)
    niv.onchange=()=>{ const k=+niv.value; if(k){ l.titre={niveau:k, texte:inp.value} } else { delete l.titre } planifierSave(); rendre() }
    row.appendChild(niv)
    if(l.ajout_humain){
      // Ligne ajoutée à la main : bouton SUPPRIMER (jamais « incertain » — une ligne humaine n'est pas douteuse).
      const del=document.createElement('button'); del.type='button'; del.className='inc sup'; del.textContent='✕'
      del.title='Supprimer cette ligne ajoutée à la main. (Ne touche jamais aux lignes issues de l\'OCR.)'
      del.onclick=()=>supprimerLigne(i)
      row.appendChild(del)
    } else {
      // Marqueur « lecture incertaine » : exclut la ligne du banc / ground-truth tant qu'elle n'est pas tranchée.
      const inc=document.createElement('button'); inc.type='button'; inc.className='inc'+(l.incertain?' on':''); inc.textContent='⚠'
      inc.title='Lecture incertaine : à trancher. Exclue du banc et de l\'entraînement tant qu\'elle est marquée.'
      inc.onclick=()=>{ l.incertain=!l.incertain; if(l.incertain) l.valide_humain=false; inc.classList.toggle('on',l.incertain); row.classList.toggle('incertain',l.incertain); row.classList.toggle('valide',!!l.valide_humain&&!l.incertain); planifierSave() }
      row.appendChild(inc)
    }
    // Suggestion de structure (§ GPT) : rôle proposé + décision humaine (role_confirme fait foi).
    const s=l.suggestion
    const horsCorps=['numero_page','signature','reclame','titre_courant','paratexte_titre','ornement','bruit']
    if(s && s.role_confirme && horsCorps.includes(s.role_confirme)) row.classList.add('horscorps')
    if(s && /^(lettrine|artefact)_candidate$/.test(s.role_suggere||'')){
      // Passe 3 Q1 — 4 décisions ; JAMAIS de lettre proposée automatiquement.
      const sel=document.createElement('select'); sel.className='sugg lettr'
      const marque=s.correction ? (s.correction.restitution_editoriale?' ⟨restit.⟩':' ✓') : ' ⚠'
      sel.innerHTML='<option value="">'+s.role_suggere.replace('_candidate','')+marque+'</option>'
        +'<option value="visible">lettre visible (saisir)</option>'
        +'<option value="conjecture">illisible (restitution)</option>'
        +'<option value="artefact">artefact / ornement</option>'
        +'<option value="faux">faux positif (texte)</option>'
      sel.title='Lettrine — score '+(s.score||0)+'. Décision humaine ; aucune lettre n\'est proposée automatiquement.'
      sel.onchange=()=>{ const v=sel.value
        if(v==='artefact'){ s.role_confirme='bruit'; s.statut='confirme'; delete s.correction; l.incertain=false; planifierSave(); rendre() }
        else if(v==='faux'){ s.role_confirme='corps'; s.statut='confirme'; delete s.correction; l.incertain=false; planifierSave(); rendre() }
        else if(v==='visible'||v==='conjecture'){ saisirInitiale(l, s, v==='visible') } }
      row.appendChild(sel)
      if(Array.isArray(l.bbox)){ const z=document.createElement('button'); z.type='button'; z.className='inc'; z.textContent='🔍'
        z.title='Zoom sur la région de la lettrine'; z.onclick=()=>zoomRegion(l.bbox); row.appendChild(z) }
    } else if(s && s.role_suggere){
      // Rôle « nu » (sans suffixe candidate/geometrique) qui fera foi une fois confirmé.
      const brut=s.role_suggere.replace('_candidate','').replace('_geometrique','')
      const libelle=(brut==='signature')?'marque de cahier':brut.replace(/_/g,' ')
      const chip=document.createElement('button')
      const extra=(s.niveau_suggere?(' T'+s.niveau_suggere):'')+(s.blanc_poesie?(' · '+s.blanc_poesie):'')
      chip.className='sugg'+(s.role_confirme?' ok':'')
      chip.textContent=libelle+extra+(s.role_confirme?' ✓':'')
      let aide='Suggestion : '+s.role_suggere+' (score '+(s.score||0)+'). Clic → confirmer / re-clic → annuler.'
      if(brut==='signature') aide+=' — Marque de cahier (signature bibliographique) : lettre ou chiffre imprimé au bas du feuillet pour repérer le cahier et l’ordre des feuillets.'
      if(s.role_suggere==='titre_courant') aide+=' [confirme le motif EN LOT]'
      if(s.preuves) aide+=' · '+JSON.stringify(s.preuves)
      chip.title=aide
      chip.onclick=()=>{
        const confirmer=!s.role_confirme, role=s.niveau_suggere?'titre':brut
        s.role_confirme=confirmer?role:null; s.statut=confirmer?'confirme':'suggere'
        // §6 : confirmer un titre courant vaut pour TOUTES les occurrences du même motif (en lot).
        if(s.role_suggere==='titre_courant' && s.preuves && s.preuves.cle){ const cle=s.preuves.cle
          for(const k of Object.keys(S.pages)) for(const ll of (S.pages[k].lignes||[])){ const ss=ll.suggestion
            if(ss && ss.role_suggere==='titre_courant' && ss.preuves && ss.preuves.cle===cle){ ss.role_confirme=confirmer?'titre_courant':null; ss.statut=confirmer?'confirme':'suggere' } } }
        planifierSave(); rendre()
      }
      row.appendChild(chip)
    } else {
      // §5 : classement MANUEL d'une région hors-corps (aucune suggestion sur cette ligne).
      // Jeu complet des rôles hors-corps (cf. liste horsCorps ci-dessus) — libellés lisibles.
      const cls=document.createElement('select'); cls.className='niv'; cls.title='Classer cette ligne hors du corps (pagination, titre courant, réclame, paratexte, ornement, bruit…). « — » = corps.'
      cls.innerHTML='<option value="">— (corps)</option>'+[
        ['numero_page','numéro de page'],['titre_courant','titre courant'],['signature','marque de cahier'],
        ['reclame','réclame'],['paratexte_titre','paratexte (titre)'],['ornement','ornement'],
        ['bruit','bruit / artefact'],['indetermine','indéterminé'],
      ].map(([v,t])=>`<option value="${v}">${t}</option>`).join('')
      cls.value=(s&&s.role_confirme)||''
      cls.onchange=()=>{ if(!l.suggestion) l.suggestion={role_suggere:null,role_confirme:null,statut:'suggere',export_corps:true,preuves:{}}
        l.suggestion.role_confirme=cls.value||null; l.suggestion.statut=cls.value?'confirme':'suggere'; l.suggestion.export_corps=!cls.value; planifierSave(); rendre() }
      row.appendChild(cls)
    }
    // Passe 3 Q2 — suggestion de césure (jamais silencieuse) : « - » en fin de ligne + suite en minuscule.
    { const suiv=pg.lignes[i+1]
      if(!l.cesure && !estTitre && !entete && suiv && suggererCesureClient(l[S.couche], suiv[S.couche])){
        const cc=document.createElement('button'); cc.type='button'; cc.className='sugg'; cc.textContent='césure ¬ ?'
        cc.title='Fin de ligne « - » et la suite continue le mot → classer en césure typographique « ¬ » (recollée à l\'affichage). Clic = confirmer, jamais automatique.'
        cc.onclick=()=>appliquerCesure(l); row.appendChild(cc) } }
    vl.appendChild(row) })
}

// Ajout / suppression d'une ligne saisie à la main (texte que l'OCR n'a pas capté : folio, réclame…).
// Provenance : ajout_humain=true, ocr0='' (la machine n'a rien lu là), bbox=null (aucune région image)
// → jamais versée à l'entraînement (filtre bbox en aval), mais comptée dans l'évaluation du banc.
function insererLigne(i){ const pg=S.pages[S.page]; if(!pg||!Array.isArray(pg.lignes)) return
  const pos=Math.max(0, Math.min(pg.lignes.length, i|0))
  pg.lignes.splice(pos, 0, { bbox:null, ocr0:'', dip:'', dev:'', mod:'', confiance:null, ajout_humain:true })
  planifierSave(); rendre()
  const inp=$('lignes').querySelector(`.lg[data-i="${pos}"] input`); if(inp) inp.focus() }
function supprimerLigne(i){ const pg=S.pages[S.page]; const l=pg&&pg.lignes&&pg.lignes[i]
  if(!l||!l.ajout_humain) return // sécurité : on ne supprime JAMAIS une ligne issue de l'OCR
  pg.lignes.splice(i, 1); planifierSave(); rendre() }

// Naviguer d'une page à l'autre (scan + texte). Si la page n'est pas encore océrisée, on l'OCRise.
async function allerPage(n){
  if(n<1 || (S.total && n>S.total)) return
  S.page=n; $('page').value=n
  if(S.pages[n] && S.pages[n].lignes){ rendre(); etat('page '+n); return } // déjà océrisée → simple affichage
  assurerNomProjet(); S.arret=false; $('stop').disabled=false; chargeOn('OCR page '+n+'…')
  try{ await ocr(n); marquerEtat(n,'termine'); rendre(); etat('page '+n+' : '+S.pages[n].lignes.length+' lignes'); await sauver(true) }
  catch(e){ if(!S.arret){ marquerEtat(n,'erreur',e.message); journaliser(n,e.message); await sauver(true) } rendre(); etat(S.arret?'Arrêté.':'échec : '+e.message) }
  finally{ $('stop').disabled=true; chargeOff() }
}

// Feuilletage (flèches sur l'image) : va à la page précédente/suivante QUI A UNE IMAGE, en
// sautant les pages jamais océrisées ou en erreur, et sans relancer d'OCR (revue seulement).
// L'OCR séquentiel reste sur « ‹ page / page › » et « OCR cette page » de la barre du haut.
function pagesAvecImage(){ return Object.keys(S.pages).map(Number)
  .filter(n=>S.pages[n]&&S.pages[n].pngUrl&&Array.isArray(S.pages[n].lignes)&&S.pages[n].lignes.length)
  .sort((a,b)=>a-b) }
function feuilleter(sens){ const L=pagesAvecImage(); if(!L.length) return
  const cible = sens>0 ? L.find(n=>n>S.page) : [...L].reverse().find(n=>n<S.page)
  if(cible==null) return // déjà à la première/dernière page avec image
  S.page=cible; $('page').value=cible; rendre(); etat('page '+cible) }
$('navPrec').onclick=()=>feuilleter(-1)
$('navSuiv').onclick=()=>feuilleter(1)

// OCR d'un lot. Persistance APRÈS CHAQUE page → reprise garantie (au pire, une page perdue).
// `cibles` = liste explicite (relancer les erreurs) ; sinon on prend la plage en SAUTANT les faites.
async function ocrDocument(cibles){
  assurerNomProjet()
  const de=$('de').valueAsNumber||1, a=$('a').valueAsNumber||de
  const liste = cibles || pagesATraiter(de,a) // reprise automatique : on saute les pages « terminé »
  if(!liste.length){ etat('Rien à traiter : toutes les pages de la plage sont déjà faites.'); majProgres(de,a); return }
  S.arret=false; $('stop').disabled=false; $('ocrDoc').disabled=true; $('ocrPage').disabled=true; $('btnRelancerErr').disabled=true
  majProgres(de,a); let ok=0, ko=0, i=0
  try{
    for(const n of liste){ if(S.arret) break; i++
      etat(`OCR document — page ${n} (${i}/${liste.length})…`); chargeOn(`OCR document — page ${n} (${i}/${liste.length})…`)
      try{ await ocr(n); marquerEtat(n,'termine'); ok++ }
      catch(e){ if(S.arret) break; marquerEtat(n,'erreur',e.message); journaliser(n,e.message); ko++ }
      S.page=n; $('page').value=n; rendre()
      await sauver(true)          // ← persistance immédiate
      majProgres(de,a)
    }
  } finally {
    $('stop').disabled=true; $('ocrDoc').disabled=false; $('ocrPage').disabled=false; $('btnRelancerErr').disabled=false; chargeOff(); majProgres(de,a)
  }
  etat(S.arret ? `Arrêté — ${ok} page(s) faite(s) ; « OCR document » reprend là où on s'est arrêté.` : `Terminé — ${ok} page(s), ${ko} erreur(s).`)
}

// ── Prétraitement expérimental + comparaison A/B ─────────────────────────────
function collecterPretraitement(){
  const p={ gris:$('p_gris').checked, contraste:$('p_contraste').checked, deskew:$('p_deskew').checked,
    binariser:$('p_binariser').checked, debruiter:$('p_debruiter').checked, rogner:$('p_rogner').checked, demiPage:$('p_demi').value||undefined }
  return (p.gris||p.contraste||p.deskew||p.binariser||p.debruiter||p.rogner||p.demiPage) ? p : null
}
async function comparer(){
  const chemin=$('chemin').value.trim(); if(!chemin){ etat('choisis d\'abord un fichier'); return }
  if(S.kind!=='imprime'){ etat('la comparaison est prévue pour l\'imprimé (PDF)'); return }
  const pre=collecterPretraitement(); if(!pre){ etat('coche au moins une option de prétraitement à comparer'); return }
  const n=$('page').valueAsNumber||1
  const moteur=($('typo')&&$('typo').value==='ancien')?'kraken-print':'tesseract'
  chargeOn('Comparaison page '+n+' (2 OCR)…')
  try{
    const r=await api('/api/atelier/comparer',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({pdfWin:chemin,page:n,dpi:300,lang:'fra',moteur,pretraitement:pre})})
    const o=r.original, p=r.pretraite
    const verdict=(p.confMoy!=null&&o.confMoy!=null)?(p.confMoy>o.confMoy?'✅ AMÉLIORE':(p.confMoy<o.confMoy?'⚠ DÉGRADE':'≈ égal')):''
    $('compHint').textContent=`confiance moy : original ${o.confMoy} · prétraité ${p.confMoy} — ${verdict} (indice ; vérifie à l'œil)`
    $('compTeteA').textContent=`ORIGINAL — ${o.nbLignes} lignes, confiance ${o.confMoy}`
    $('compTeteB').textContent=`PRÉTRAITÉ — ${p.nbLignes} lignes, confiance ${p.confMoy}`
    $('compTexteA').textContent=o.texte; $('compTexteB').textContent=p.texte
    $('comparateur').style.display='block'; etat('comparaison affichée')
  }catch(e){ etat('comparaison échouée : '+e.message) }
  finally{ chargeOff() }
}

// Champs = colonnes de la table `oeuvres` du site (correspondance exacte).
const CHAMPS_META=['auteur','titre','sous_titre','titre_original','langue_originale','langue_trad','trad_auteur','editeur','collection','ville','date_publication','date_composition','genre']
const vMeta=c=>$('m_'+c).value.trim()||null
function collecterMeta(){ const o={}; CHAMPS_META.forEach(c=>o[c]=vMeta(c)); return o }
function remplirMeta(m, auto){ if(!m)return
  // Compat. anciens projets : traducteur→trad_auteur, lieu→ville, date_edition→date_publication.
  const compat={ ...m, trad_auteur:m.trad_auteur??m.traducteur, ville:m.ville??m.lieu,
    date_publication:m.date_publication??m.date_edition,
    langue_originale:m.langue_originale??((m.langues||[]).find(l=>/lat|grec/i.test(l))||null) }
  // `auto` (dépôt / bouton Extraire) marque le champ comme deviné par le PARSEUR : « IA titre » pourra
  // le remplacer. Sans `auto` (réouverture de projet), les valeurs sont établies et non remplaçables.
  CHAMPS_META.forEach(c=>{ const el=$('m_'+c); el.value=compat[c]||''; el.classList.remove('meta-ia')
    if(auto && el.value.trim()) el.classList.add('meta-auto'); else el.classList.remove('meta-auto') }) }

async function televerser(file){
  if(!file) return
  etat('téléversement de '+file.name+'…')
  try{
    const r=await fetch('/api/televerser?nom='+encodeURIComponent(file.name),{method:'POST',body:file})
    const j=await r.json(); if(!r.ok) throw new Error(j.erreur||r.statusText)
    $('chemin').value=j.chemin
    // Nature devinée : image → manuscrit (Kraken) ; PDF → imprimé (Tesseract). Modifiable.
    const estImg=/\.(png|jpe?g|tiff?|webp)$/i.test(j.nom||file.name)
    $('kind').value=estImg?'manuscrit':'imprime'; $('kind').onchange()
    etat('fichier reçu : '+j.nom); analyser()
  }catch(e){ etat('échec du téléversement : '+e.message) }
}

// Diagnostic IA — complète les métadonnées VIDES en lisant la page de titre par vision (cloud, avec
// consentement). Ne remplace jamais un champ déjà rempli à la main ; marque les champs proposés par l'IA.
async function completerMetaIA(){ const chemin=$('chemin').value.trim(); if(!chemin){ $('etatMeta').textContent='choisis d\'abord un fichier'; return }
  await chargerEtatIA()
  const f=S.ia&&S.ia.fournisseur
  if(!f||!f.cloud){ $('etatMeta').textContent='IA locale (mock) : pas de lecture cloud. Configure un fournisseur pour l\'utiliser.'; return }
  if(!f.dispo){ $('etatMeta').textContent='fournisseur cloud sans clé : rien n\'est envoyé.'; return }
  if(!consentementValideClient()){ const ok=await demanderConsentement(); if(!ok){ $('etatMeta').textContent='resté en local : aucune lecture cloud.'; return } }
  $('main').classList.remove('meta-replie'); $('metaToggle').textContent='‹'
  const page=(S.page&&S.page<=7)?S.page:3
  const lignesCour=(S.pages&&S.pages[S.page]&&S.pages[S.page].lignes)||[]
  const texteTitre=lignesCour.map(l=>l.dip||l.texte||'').join('\n')
  $('etatMeta').textContent='lecture IA de la page de titre…'; chargeOn('Lecture IA de la page de titre…')
  try{ const r=await api('/api/ia/metadonnees',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path:chemin,page,texteTitre})})
    console.log('IA titre — réponse:', r) // diagnostic (visible dans la console F12)
    if(!r.ia_active){ $('etatMeta').textContent='IA non active ('+(r.motif||'—')+')'; return }
    const m=r.meta_ia||{}; let n=0
    // On remplace les champs VIDES et ceux devinés par le parseur (meta-auto) ; jamais ce que tu as tapé.
    CHAMPS_META.forEach(c=>{ const el=$('m_'+c); if(!el)return
      const remplacable=!el.value.trim()||el.classList.contains('meta-auto')
      if(m[c]!=null&&String(m[c]).trim()&&remplacable){ el.value=String(m[c]).trim(); el.classList.add('meta-ia'); el.classList.remove('meta-auto'); el.title='proposé par l\'IA — à vérifier'; n++ } })
    if(r.abstention&&!n){ $('etatMeta').textContent='IA ('+(r.fournisseur||'?')+') s\'est abstenue'+(r.erreur?(' : '+r.erreur):' (page non lisible / pas une page de titre)')+' — rien ajouté.' }
    else $('etatMeta').textContent='✓ IA : '+n+' champ(s) renseigné(s) par lecture d\'image — à vérifier'+(r.confiance!=null?(' (confiance '+r.confiance+')'):'')
    if(n){ planifierSave() }
  }catch(e){ $('etatMeta').textContent='échec IA : '+e.message }
  finally{ chargeOff() } }

  { const avecImg=Object.keys(S.pages).map(Number).filter(n=>S.pages[n]?.pngUrl&&S.pages[n]?.lignes?.length).sort((a,b)=>a-b)

function majValidees(){ const n=Object.keys(S.pages).filter(k=>S.pages[k]?.valide_humain).length; $('nbValidees').textContent=n?`${n} validée(s) humain`:'' }
$('btnValider').onclick=()=>{ const n=S.page, pg=S.pages[n]
  if(!pg||!pg.lignes||!pg.lignes.length){ etat('rien à valider : page pas encore océrisée'); return }
  if(pg.valide_humain){ // dé-valider (bascule)
    pg.valide_humain=false; pg.valide=false; pg.lignes.forEach(l=>l.valide_humain=false)
    majValidees(); rendre(); sauver(true); etat(`page ${n} : validation humaine retirée`); return }
  let ok=0, incert=0
  pg.lignes.forEach(l=>{ if(l.incertain){ l.valide_humain=false; incert++ }
    else if(String(l.dip??'').trim()){ l.valide_humain=true; ok++ } else l.valide_humain=false })
  pg.valide_humain=true; pg.valide=true // compat export entraînement
  majValidees(); rendre(); sauver(true)
  etat(`page ${n} validée (humain) : ${ok} ligne(s)${incert?`, ${incert} incertaine(s) exclue(s)`:''}`) }
$('btnExportEntr').onclick=async()=>{ const nom=$('projet').value.trim()||'entrainement'; $('etatExport').textContent='export entraînement…'
  try{ const r=await api('/api/export/entrainement',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nom,projet:projetActuel()})})
    $('etatExport').textContent=r.nbPages?`✓ entraînement : ${r.nbPages} page(s), ${r.nbLignes} ligne(s) (${r.nbCorrigees} corrigées) → exports/entrainement/${nom}/`:'aucune page validée — clique « ✓ Valider la page » d\'abord' }
  catch(e){ $('etatExport').textContent='échec : '+e.message } }
$('btnAnalyseStruct').onclick=async()=>{ $('etatExport').textContent='analyse de la structure…'
  try{ const r=await api('/api/atelier/analyser',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({projet:projetActuel()})})
    let n=0
    for(const k of Object.keys(r.pages||{})){ const src=r.pages[k].lignes||[], dst=(S.pages[k]&&S.pages[k].lignes)||[]
      src.forEach((l,i)=>{ if(dst[i]&&l.suggestion){ dst[i].suggestion=l.suggestion; if(l.suggestion.role_suggere)n++ } }) }
    rendre(); planifierSave(); $('etatExport').textContent=`✓ structure analysée : ${n} suggestion(s) (à confirmer ligne par ligne)` }
  catch(e){ $('etatExport').textContent='analyse échouée : '+e.message } }
$('btnExportBanc').onclick=async()=>{ const nom=$('projet').value.trim()||'banc'; $('etatExport').textContent='export du banc…'
  try{ const r=await api('/api/export/banc',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nom,projet:projetActuel()})})
    $('etatExport').textContent=`✓ banc : ${r.nbPages} page(s), ${r.nbLignes} ligne(s), ${r.nbCaracteres} caractères → bancs/${nom}/` }
  catch(e){ $('etatExport').textContent='banc refusé : '+e.message+' (valide les pages à la main d\'abord)' } }
listerProjets()

// Pré-vol : vérifier que les moteurs sont là, sinon prévenir clairement (plutôt qu'un
// stderr brut au premier OCR). WSL est requis ; Tesseract sert l'imprimé, Kraken le manuscrit.
async function preVol(){
  try{ const d=await api('/api/doctor'); const o=d.outils||{}
    const manques=[]
    if(!o.wsl?.present) manques.push('WSL (indispensable)')
    if(!o.tesseract?.present) manques.push('Tesseract (imprimé)')
    if(!o.kraken?.present) manques.push('Kraken (manuscrit)')
    if(manques.length){ const g=$('diag'); g.style.display='flex'
      g.textContent='⚠ Outils manquants : '+manques.join(' · ')+' — installe-les (scripts/installer-wsl.sh) avant d’océriser.' }
  }catch{ /* doctor indisponible : on n’empêche rien */ }
}
preVol()
