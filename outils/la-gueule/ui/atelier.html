<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>La Gueule — Atelier de relecture</title>
<link rel="icon" type="image/png" href="/logo-vert.png?v=20260808" />
<style>
  :root{--fond:#f7f3ea;--surface:#fffdf8;--encre:#2b2620;--second:#6b6155;--bord:#d9ccb4;
    --vert:#5a7260;--vertf:rgba(90,114,96,.12);--ambre:#9a5a2a;--surlig:rgba(154,90,42,.28)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--fond);color:var(--encre);font-family:"Segoe UI",system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column}
  header{padding:11px 20px;border-bottom:1px solid var(--bord);background:var(--surface);display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  header h1{margin:0;font-family:Georgia,serif;font-weight:500;font-size:17px}
  header .logo{height:30px;width:58px;display:block;object-fit:contain;flex:none}
  header .sep{flex:1}
  label{font-size:12px;color:var(--second)}
  input,select{padding:5px 8px;border:1px solid var(--bord);border-radius:6px;background:#fff;color:var(--encre);font:inherit;transition:border-color .12s}
  input:focus,select:focus{outline:none;border-color:var(--vert)}
  input[type=number]{width:64px}
  #chemin{width:min(46vw,560px)}
  button{cursor:pointer;border:1px solid var(--vert);border-radius:6px;background:var(--vertf);color:var(--vert);padding:6px 12px;font:inherit;font-weight:600;transition:background .12s,border-color .12s,color .12s}
  button:hover:not(:disabled){background:var(--vert);color:#fff}
  button.discret{border-color:var(--bord);color:var(--second);background:var(--surface);font-weight:400}
  button.discret:hover:not(:disabled){border-color:var(--vert);color:var(--vert);background:var(--surface)}
  button:disabled{opacity:.5;cursor:default}
  #etat{font-size:12px;color:var(--second)}
  main{flex:1;display:grid;grid-template-columns:340px 1fr 1fr;gap:0;min-height:0}
  main.meta-replie{grid-template-columns:32px 1fr 1fr}
  .volet{min-height:0;overflow:auto;padding:12px}
  /* Colonne « Métadonnées » (gauche), repliable */
  .volet-meta{min-height:0;overflow:auto;border-right:1px solid var(--bord);background:var(--surface);display:flex;flex-direction:column}
  .meta-tete{display:flex;padding:8px 8px 0;position:sticky;top:0;background:var(--surface);z-index:1}
  [data-theme="dark"] .vtabs button.actif{color:#12100d}
  .meta-titre{font-family:Georgia,serif;font-size:14px;color:var(--encre);flex:1}
  .meta-toggle{border:1px solid var(--bord);background:#fff;color:var(--second);border-radius:5px;padding:2px 8px;cursor:pointer;font-weight:700;line-height:1}
  .meta-corps{padding:10px;display:flex;flex-direction:column;gap:7px}
  .meta-corps label{display:flex;flex-direction:column;gap:3px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--second)}
  .meta-corps input{width:100%;font-size:13px;box-sizing:border-box}
  .meta-corps input.meta-auto{background:#e7e5df;color:#1f1f1f} /* deviné par le parseur (remplaçable par l'IA) */
  .meta-corps input.meta-ia{background:#fbeecb;border-color:#c9971f;color:#1a1a1a;font-weight:500} /* proposé par l'IA (lecture d'image), à vérifier */
  .meta-corps input.meta-ia-enrichi{background:#e3eefb;border-color:#5b8fd6;color:#12314f;font-weight:500} /* niveau 2 : catalogue (ta base), à vérifier */
  .meta-corps input.meta-ia-conn{background:#efe6fb;border-color:#8a6fc9;color:#2e1f4a;font-weight:500} /* niveau 3 : connaissance de l'IA (hors page/base), à vérifier */
  .meta-etat{font-size:11px;color:var(--second);min-height:1em;margin-top:2px}
  .meta-diag{font-size:11px;color:var(--second);margin-top:4px}
  .meta-diag summary{cursor:pointer;color:var(--second)}
  .meta-diag .dg-sec{margin:4px 0 2px;font-weight:600;color:var(--fg)}
  .meta-diag code{background:#eee;padding:0 3px;border-radius:2px}
  .meta-diag .dg-vide{color:#b06a2a}
  main.meta-replie .vtabs,main.meta-replie .vpanel{display:none}
  main.meta-replie .meta-tete{flex-direction:column;padding:8px 3px;border-bottom:none}
  .vtabs{display:flex;flex:1;border-bottom:1px solid var(--bord)}
  .vtabs button{flex:1;min-width:0;padding:9px 4px;border:none;background:none;font-size:11px;color:var(--second);border-bottom:2px solid transparent;border-radius:0;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:-1px;transition:color .12s,border-color .12s}
  .vtabs button:hover{color:var(--encre)}
  .vtabs button.actif{color:var(--vert);border-bottom-color:var(--vert);font-weight:700}
  /* Onglet Contrôle : badge + cartes de proposition IA (Phase — retour 2026-08-10). */
  .badge-ctrl{display:inline-block;min-width:15px;padding:0 4px;margin-left:3px;border-radius:8px;background:var(--ambre,#c9971f);color:#fff;font-size:10px;font-weight:700;text-align:center;line-height:15px}
  .ctrl-tete{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:2px 0 8px}
  .ctrl-item{border:1px solid var(--bord);border-radius:6px;padding:6px 8px;margin-bottom:7px;background:var(--fond-clair,#faf8f4);cursor:pointer}
  .ctrl-item:hover{border-color:var(--vert)}
  .ctrl-item .ct-tete{font-size:10.5px;color:var(--second);margin-bottom:3px;display:flex;justify-content:space-between;gap:6px}
  .ctrl-item .ct-avapr{font-size:12.5px;margin:2px 0;word-break:break-word}
  .ctrl-item .ct-avapr .av{color:#9a2a2a;text-decoration:line-through}
  .ctrl-item .ct-avapr .apr{color:#2e5440;font-weight:600}
  .ctrl-item .ct-act{display:flex;gap:6px;margin-top:5px}
  .ctrl-item .ct-act button{font-size:11px}
  .ct-vld{background:var(--vert);color:#fff;border-color:var(--vert)}
  .ctrl-fam{border:1px dashed var(--bord);border-radius:6px;padding:5px 8px;margin-bottom:7px;font-size:12px;color:var(--second);display:flex;justify-content:space-between;gap:8px;align-items:center}
  .ctrl-vide{font-size:12px;color:var(--second);padding:8px 0;line-height:1.5}
  .lg.cible input{background:#fff4d6;box-shadow:0 0 0 2px var(--ambre,#c9971f)}
  .vpanel-actions{display:flex;gap:7px;padding:9px 10px 2px}
  .vpanel-actions button{flex:1;padding:6px 4px;font-weight:600}
  .vpanel-corps,.vpanel .barre2{display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:10px;background:transparent;border:none}
  .vpanel .barre2 button{align-self:stretch;padding:7px 4px}
  .vpanel .barre2 input:not([type=checkbox]),.vpanel .barre2 select{width:100%!important;box-sizing:border-box}
  .vpanel .barre2 > label{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--second);display:flex;flex-direction:column;gap:3px}
  .vpanel .barre2 .pchk{flex-direction:row;align-items:center;gap:6px;font-size:12px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--encre)}
  .vpanel .barre2 #etatSave,.vpanel .barre2 #etatExport,.vpanel .barre2 #nbValidees{font-size:11px;color:var(--second)}
  .vpanel-titre{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--second);padding:12px 12px 0}
  /* Zone image : l'image tient dans la hauteur du volet (pas de défilement) ; chevrons de nav. */
  #voletImage{background:#efe8da;border-right:1px solid var(--bord);position:relative;overflow:hidden;
    display:flex;align-items:flex-start;justify-content:center;padding:12px}
  #imgHolder{max-width:100%;max-height:100%;display:flex;align-items:flex-start;justify-content:center}
  .scene{position:relative;display:inline-block;box-shadow:0 2px 12px rgba(0,0,0,.15);background:#fff}
  .scene img{display:block;max-width:100%;height:auto}
  /* Passe 3 : zoom sur la région d'une lettrine (clic n'importe où pour fermer). */
  #zoomOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:10001;cursor:zoom-out}
  .zoombox{background-repeat:no-repeat;background-color:#fff;box-shadow:0 8px 40px rgba(0,0,0,.5);border:3px solid #fff;border-radius:4px}
  /* Pipeline 5 étapes (Phase A) : représentation persistante de l'état du parcours. */
  #barreEtapes{display:flex;background:var(--surface);border-bottom:1px solid var(--bord)}
  .etape{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:6px 13px;font-size:11.5px;background:#efeadf;color:#7d7259;border-right:1px solid var(--bord);transition:filter .12s}
  .etape:last-child{border-right:none}
  .etape .num{flex:none;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:700;background:rgba(0,0,0,.09)}
  .etape .lib{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .etape .badge{margin-left:auto;font-size:10px;font-weight:500;white-space:nowrap;opacity:.92}
  .etape.fait{background:#e1efe3;color:#2f6a47} .etape.fait .num{background:#bfe0c6;color:#215838}
  .etape.encours{background:#fdeccb;color:#8a5a12} .etape.encours .num{background:#f1cf8d;color:#6b430a}
  .etape.afaire{background:#f2ecdf;color:#8a7c5e} .etape.afaire .num{background:#e2d6bd;color:#6f6242}
  .etape.souci{background:#f7ddd4;color:#9a2f24} .etape.souci .num{background:#e9b5aa;color:#7a231a}
  .etape.active{box-shadow:inset 0 2px 0 var(--vert)}
  .etape.clic{cursor:pointer} .etape.clic:hover{filter:brightness(.965)}
  .badge.non_commence{background:#ececec;color:#888}
  .badge.pret{background:#e6f0e6;color:#3d6b4f}
  .badge.en_cours{background:#fef3d8;color:#b26a1a}
  .badge.termine{background:#e2f0e2;color:#2e5440}
  .badge.a_verifier{background:#fdf0d8;color:#a8720f}
  .badge.perime{background:#fbe6de;color:#b5482a}
  .badge.bloque,.badge.erreur{background:#fadbd0;color:#9a2a2a}
  [data-theme="dark"] #barreEtapes{background:#241f1a}
  [data-theme="dark"] .etape{background:#2c2720;color:#b7ab97}
  [data-theme="dark"] .etape .num{background:rgba(255,255,255,.09)}
  [data-theme="dark"] .etape.fait{background:#243528;color:#9fceb0}
  [data-theme="dark"] .etape.fait .num{background:#2f5a3d;color:#bfe0c6}
  [data-theme="dark"] .etape.encours{background:#3a2f1c;color:#e2b871}
  [data-theme="dark"] .etape.afaire{background:#2f2a20;color:#bcae8c}
  [data-theme="dark"] .etape.souci{background:#3a2420;color:#e2a397}
  /* Phase E — panneau de validation ciblée (familles + critiques + blocages). */
  #panneauValidation{padding:8px 12px;background:var(--fond-clair,#faf8f4);border-bottom:1px solid var(--bord);font-size:13px}
  #panneauValidation .val-tete{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
  #panneauValidation .val-fam{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:3px 0;border-top:1px solid var(--bord-clair,#e4dfd8)}
  #panneauValidation .val-fam span{color:var(--second)}
  #panneauValidation .val-bloc{margin-top:6px;color:#9a2a2a;font-weight:600}
  #panneauValidation .val-crit{margin-top:6px;padding:6px 8px;border:1px solid #e0b57a;border-radius:6px;background:#fdf6ec}
  #panneauValidation .val-crit-tete{font-weight:600;color:#8a5a1a;font-size:12px}
  #panneauValidation .val-avapr{margin:3px 0;font-size:13px}
  #panneauValidation .val-avapr .av{color:#9a2a2a;text-decoration:line-through}
  #panneauValidation .val-avapr .apr{color:#2e5440;font-weight:600}
  #panneauValidation .val-crit-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
  [data-theme="dark"] #panneauValidation .val-crit{background:#3a2b18;border-color:#6a4a24}
  /* §14.6 — panneau de consentement cloud. */
  #panneauConsentement{padding:10px 12px;background:#fdf6ec;border-bottom:1px solid #e0b57a;font-size:13px;line-height:1.5}
  #panneauConsentement .cons-act{display:flex;gap:8px;margin-top:8px}
  [data-theme="dark"] #panneauConsentement{background:#3a2b18;border-color:#6a4a24}
  .navflip{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:34px;height:46px;
    border:1px solid var(--bord);background:rgba(255,253,248,.9);color:var(--vert);border-radius:8px;
    font-size:22px;line-height:1;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.12)}
  .navflip:hover{background:#fff}
  .navflip-g{left:8px}
  .navflip-d{right:8px}
  .box{position:absolute;border:1px solid rgba(90,114,96,.35);border-radius:2px;cursor:pointer}
  .box:hover{background:rgba(90,114,96,.12)}
  .box.actif{background:var(--surlig);border-color:var(--ambre)}
  /* Réglages du volet gauche : un intitulé au-dessus, un contrôle pleine largeur — même forme pour
     tous, pour qu'on lise la question avant la réponse. */
  .vpanel-corps .reglage{display:flex;flex-direction:column;gap:3px;align-items:stretch;width:100%;margin-bottom:9px;font-size:11px;color:var(--second)}
  .vpanel-corps .reglage select{width:100%}
  .vpanel-corps label.reglage:has(input[type=checkbox]){flex-direction:row;align-items:center;gap:6px}
  /* Ligne pointée depuis l'onglet Contrôle : visible sur le fac-similé, pas seulement dans le texte. */
  .box.cible{background:rgba(201,151,31,.28);border:2px solid var(--ambre,#c9971f);box-shadow:0 0 0 2px rgba(201,151,31,.35)}
  /* ── Mode COULEUR : chaque rôle a sa teinte, dans le texte ET sur le fac-similé, pour vérifier
     les classements d'un coup d'œil au lieu de lire ligne à ligne. Teintes franches mais pâles :
     elles doivent situer, pas crier. Le corps reste presque blanc — c'est la masse. */
  .roles .lg[data-role="corps"] input{background:#fdfaf3}
  .roles .lg[data-role="note_marginale"] input{background:#f2e2d0;border-color:#b07a45}
  .roles .lg[data-role="note_bas_page"] input{background:#eadcc8;border-color:#9a6a3a}
  .roles .lg[data-role="titre"] input{background:#e5eef7;border-color:#5b86ad}
  .roles .lg[data-role="paratexte_titre"] input{background:#e0e8f5;border-color:#6b7fb5}
  .roles .lg[data-role="titre_courant"] input{background:#ece7f5;border-color:#8b7ab5}
  .roles .lg[data-role="numero_page"] input{background:#eef0f2;border-color:#8d97a1;font-style:italic}
  .roles .lg[data-role="signature"] input{background:#eef0f2;border-color:#8d97a1;font-style:italic}
  .roles .lg[data-role="reclame"] input{background:#e8f0ea;border-color:#6f9a7c;font-style:italic}
  .roles .lg[data-role="ornement"] input{background:#f0e9e9;border-color:#a98a8a;text-decoration:line-through}
  .roles .lg[data-role="bruit"] input{background:#eeeaea;border-color:#a09595;text-decoration:line-through;opacity:.7}
  .roles .lg[data-role="vers"] input{background:#f6f1e4}
  /* Suggestion NON confirmée : même teinte, mais en pointillé — on distingue proposé et décidé. */
  .roles .lg[data-suggere="1"] input{border-style:dashed}
  .roles .box[data-role="note_marginale"]{background:rgba(176,122,69,.22);border-color:#b07a45}
  .roles .box[data-role="note_bas_page"]{background:rgba(154,106,58,.22);border-color:#9a6a3a}
  .roles .box[data-role="titre"],.roles .box[data-role="paratexte_titre"]{background:rgba(91,134,173,.20);border-color:#5b86ad}
  .roles .box[data-role="titre_courant"]{background:rgba(139,122,181,.20);border-color:#8b7ab5}
  .roles .box[data-role="numero_page"],.roles .box[data-role="signature"]{background:rgba(141,151,161,.20);border-color:#8d97a1}
  .roles .box[data-role="reclame"]{background:rgba(111,154,124,.20);border-color:#6f9a7c}
  .roles .box[data-role="ornement"],.roles .box[data-role="bruit"]{background:rgba(169,138,138,.22);border-color:#a98a8a}
  /* Bouton d'en-tête : son état se voit, pour qu'on sache toujours si les couleurs sont mises. */
  #btnRoles.actif{background:var(--vert,#3d6b4f);color:#fff;border-color:var(--vert,#3d6b4f)}
  #legendeRoles{display:none;flex-wrap:wrap;gap:5px 12px;align-items:center;font-size:11px;color:var(--second);padding:4px 0}
  .roles-on #legendeRoles{display:flex}
  #legendeRoles i{display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid;margin-right:4px;vertical-align:-1px}
  .onglets{display:flex;gap:6px;margin-bottom:10px}
  .onglets button{padding:4px 10px;border-radius:999px;font-size:12px}
  .onglets button.actif{background:var(--vert);color:#fff;border-color:var(--vert)}
  .lignes{display:flex;flex-direction:column;gap:1px;font-family:"Cascadia Code",Consolas,monospace}
  .lg{display:grid;grid-template-columns:2.1rem 1fr auto auto auto auto;gap:6px;align-items:center;padding:1px 5px;border-radius:6px;transition:background .12s}
  .lg:hover{background:rgba(154,90,42,.055)}
  .lg .num{font-size:10px;color:#b0a488;text-align:right}
  .lg input{width:100%;font-family:inherit;font-size:13px;line-height:1.5;border:1px solid transparent;border-radius:5px;background:#fff;padding:4px 7px;transition:border-color .12s,background .12s}
  .lg input:focus{border-color:var(--ambre);outline:none;background:var(--surface)}
  .lg.actif input{background:#fbf4ea}
  .lg.doute input{border-left:2px solid var(--ambre)}
  .lg.doute .num{color:var(--ambre);font-weight:700}
  /* Titre de structure éditoriale (Livre, Prose, Mètre…) → alimente ref_niv1..5. */
  .lg select.niv{font-size:10px;color:var(--second);border:1px solid transparent;border-radius:4px;background:transparent;align-self:center;padding:2px 3px;opacity:.5;transition:opacity .12s,border-color .12s,background .12s}
  .lg:hover select.niv,.lg select.niv:focus{opacity:1;border-color:var(--bord);background:var(--surface)}
  .lg.titre input{border-left:3px solid var(--ambre);font-weight:700;color:#5a4a2a;background:#fdf9f0}
  /* Lecture incertaine : exclue du banc / ground-truth tant qu'elle n'est pas tranchée. */
  .lg .inc{font-size:11px;line-height:1;border:1px solid transparent;border-radius:4px;background:transparent;color:#c8b8a0;align-self:center;cursor:pointer;padding:2px 5px;opacity:.5;transition:opacity .12s,border-color .12s,background .12s}
  .lg:hover .inc{opacity:1}
  .lg .inc:hover{border-color:var(--bord);background:var(--surface)}
  .lg .inc.on{opacity:1;background:#fbeee0;color:#b26a1a;border-color:#e0b57a}
  .lg.incertain input{border-left:2px dashed #c8862a;background:#fdf6ec}
  /* Ligne validée humainement (bonne pour le banc / l'entraînement). */
  .lg.valide .num{color:var(--vert);font-weight:700}
  .lg.valide input{background:#f3f8f3}
  /* Ligne AJOUTÉE à la main (texte que l'OCR n'a pas capté) : sans image, hors entraînement. */
  .lg.ajout input{border-left:3px solid var(--vert);background:#f4f9f4}
  .lg .inc.sup{color:#b5482a;opacity:1}
  .lg .inc.sup:hover{border-color:#e0a890;background:#fbeee8}
  .ajout-barre{display:flex;justify-content:flex-end;padding:1px 5px 5px}
  .ajout-barre button{font-size:11px;opacity:.6;transition:opacity .12s}
  .ajout-barre:hover button,.ajout-barre button:focus{opacity:1}
  /* Suggestion de structure (§ GPT) : rôle proposé, à confirmer. Pastille lisible. */
  .lg .sugg{font-size:9px;line-height:1.25;border:1px solid var(--bord);border-radius:999px;background:var(--surface);color:var(--second);align-self:center;cursor:pointer;padding:2px 8px;white-space:nowrap;max-width:12rem;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
  .lg .sugg:hover{border-color:var(--second)}
  .lg .sugg.ok{background:var(--vertf);color:var(--vert);border-color:var(--vert);font-weight:700}
  select.sugg.lettr,.lg .sugg.lettr{background:#fbeee0;color:#b26a1a;border-color:#e0b57a}
  /* Ligne hors-corps CONFIRMÉE : exclue du corps éditorial (jamais de la source). */
  .lg.horscorps input{opacity:.5;text-decoration:line-through;background:#f3efe6}
  /* Titre courant / n° de page détecté : exclu de l'export, signalé ici. */
  .lg.entete input{color:var(--second);font-style:italic;text-decoration:line-through;opacity:.65;background:#f3efe6}
  .lg .tagtc{font-size:9px;color:var(--second);align-self:center;white-space:nowrap;padding:1px 5px;border:1px solid transparent;border-radius:4px;background:transparent;cursor:pointer}
  .lg:hover .tagtc{border-color:var(--bord)}
  .lg .tagtc:hover{background:var(--surface);color:var(--vert)}

  /* Bouton de bascule de thème */

<script>
const $=id=>document.getElementById(id)
const api=async(u,o)=>{const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.erreur||r.statusText);return j}
// Thème clair/sombre : préférence enregistrée, sinon celle du système.
function appliquerTheme(t){ document.documentElement.setAttribute('data-theme',t); const b=$('theme'); if(b) b.textContent = t==='dark'?'☀️':'🌙' }
(function(){ const stored=localStorage.getItem('lg-theme')
  const dark = stored ? stored==='dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
  appliquerTheme(dark?'dark':'light') })()
window.addEventListener('DOMContentLoaded',()=>{ const b=$('theme'); if(!b) return
  appliquerTheme(document.documentElement.getAttribute('data-theme')||'light')
  b.onclick=()=>{ const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; localStorage.setItem('lg-theme',t); appliquerTheme(t) } })
const etat=t=>$('etat').textContent=t

// Modèle en mémoire : pages[n] = { pngUrl, largeur, hauteur, lignes:[{bbox,dip,dev,mod}] }
const S={ kind:'imprime', pages:{}, page:1, total:null, couche:'dip', arret:false, journal:[], garde:null, workflow:null, perimetre:{pages:[]}, chemin:null }

// ── Pipeline 5 étapes (Phase A) : barre visuelle persistante de l'état du parcours ──
const ETAPES_UI=[['diagnostic_ia','1','Diagnostic IA'],['ocr_local','2','OCR local'],['controle_ia','3','Contrôle IA'],['validation_ciblee','4','Validation ciblée'],['generation_locale','5','Génération locale']]
const LIB_ETAT={non_commence:'non commencé',pret:'prêt',en_cours:'en cours',termine:'terminé',a_verifier:'à vérifier',bloque:'bloqué',erreur:'erreur',perime:'périmé'}
function classeEtatEtape(et){ return (et==='termine'||et==='a_verifier') ? 'fait' : (et==='erreur'||et==='bloque') ? 'souci' : (et==='en_cours') ? 'encours' : 'afaire' }
function rendreBarreEtapes(){ const bar=$('barreEtapes'); if(!bar)return; const wf=S.workflow; bar.innerHTML=''
  for(const [cle,num,lib] of ETAPES_UI){ const et=(wf&&wf.etapes&&wf.etapes[cle]&&wf.etapes[cle].etat)||'non_commence'
    const d=document.createElement('div'); d.className='etape '+classeEtatEtape(et)+(wf&&wf.etape_active===cle?' active':'')
    const n=document.createElement('span'); n.className='num'; n.textContent=num
    const l=document.createElement('span'); l.className='lib'; l.textContent=lib
    const b=document.createElement('span'); b.className='badge'; let libEt=LIB_ETAT[et]||et
    if(cle==='ocr_local'&&wf&&wf.etapes.ocr_local&&wf.etapes.ocr_local.resume){ const rz=wf.etapes.ocr_local.resume
      if(rz.manquantes>0) libEt+=' · lot '+rz.faites+'/'+rz.total+' ('+rz.manquantes+' à faire)'
      else if(rz.total) libEt+=' · lot '+rz.faites+'/'+rz.total+(rz.erreurs?' · '+rz.erreurs+' err.':'')
      if(rz.docTotal&&rz.docTotal!==rz.total) libEt+=' · doc '+(rz.docFaites||0)+'/'+rz.docTotal }
    b.textContent=libEt
    d.appendChild(n); d.appendChild(l); d.appendChild(b)
    if(cle==='diagnostic_ia'){ d.classList.add('clic'); d.title='Refaire le diagnostic (page de titre + typographie → profil de traitement)'; d.onclick=()=>{ if($('chemin').value.trim()) analyser() } }
    if(cle==='controle_ia'){ d.classList.add('clic'); d.title='Lancer le contrôle déterministe (confiance, lignes vides, doublons, pages anormales)'; d.onclick=()=>lancerControle() }
    if(cle==='validation_ciblee'){ d.classList.add('clic'); d.title='Validation ciblée : familles à échantillonner, cas critiques, blocages'; d.onclick=()=>lancerValidation() }
    if(cle==='generation_locale'){ d.classList.add('clic'); d.title='Générer les livrables (JSON/DOCX/TXT/MD/SQL/ALTO/PAGE) + rapport de provenance'; d.onclick=()=>lancerGeneration() }
    bar.appendChild(d) } }
rendreBarreEtapes(); setTimeout(()=>{ try{ chargerEtatIA() }catch{} }, 0) // §14.6 : état du fournisseur au démarrage

// Phase B — met à jour une étape du workflow côté client (miroir de workflow.mjs).
function majEtapeClient(cle, patch, active){ if(!S.workflow) S.workflow={version_schema:1, etape_active:'diagnostic_ia', etapes:{}}
  for(const [c] of ETAPES_UI) if(!S.workflow.etapes[c]) S.workflow.etapes[c]={etat:'non_commence'}
  Object.assign(S.workflow.etapes[cle], patch||{}); if(active) S.workflow.etape_active=active; rendreBarreEtapes() }

// Profil de traitement proposé par le diagnostic (l'IA propose, n'impose pas ; prétraitement inactif).
function construireProfilClient(meta, typo, nbPages){ const anc=!!(typo&&typo.ancien)
  const lg=meta&&meta.langue_trad?[String(meta.langue_trad).toLowerCase().slice(0,2)]:[]
  return { document:{ type:anc?'imprime_ancien':'imprime_moderne', langues:lg, periode_probable:null, qualite_scan:'inconnue' },
    regimes:[{ pages_pdf:[1, nbPages||1], nature:'corps', moteur:anc?'kraken':'tesseract', modele:anc?'CATMuS-Print':null, colonnes:1 }],
    pretraitement:{ actif:false, tests_recommandes:[] },
    phenomenes:{ lettrines:true, poesie:true, notes:false, titres_courants:true, reclames:true, marques_cahier:true },
    controles_requis:[] } }

async function finaliserDiagnostic({ nbPages, meta, typographie, manuscrit }){
  const profil = manuscrit
    ? { document:{type:'manuscrit',langues:[],periode_probable:null,qualite_scan:'inconnue'}, regimes:[{pages_pdf:[1,1],nature:'corps',moteur:'kraken',modele:'CATMuS Medieval',colonnes:1}], pretraitement:{actif:false,tests_recommandes:[]}, phenomenes:{}, controles_requis:[] }
    : construireProfilClient(meta, typographie, nbPages)
  S.profil=profil
  const nom=$('projet').value.trim(); if(nom){ try{ await api('/api/ia/profil/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nom, profil})}) }catch{} }
  majEtapeClient('diagnostic_ia',{etat:'termine'}); majEtapeClient('ocr_local',{etat:'pret'},'ocr_local'); planifierSave() }

// Phase C — régime (moteur/modèle) de la page selon le profil, sinon null (→ sélecteur Typo).
function regimePourPageClient(n){ if(!S.profil||!Array.isArray(S.profil.regimes))return null
  for(const r of S.profil.regimes){ const a=r.pages_pdf&&r.pages_pdf[0], b=r.pages_pdf&&r.pages_pdf[1]
    if(a!=null&&b!=null&&n>=a&&n<=b) return {moteur:r.moteur||'kraken',modele:r.modele||null,nature:r.nature||'corps'} }
  return null }
function pageAnormaleClient(lignes){ const arr=Array.isArray(lignes)?lignes:[]; const nb=arr.reduce((s,l)=>s+String((l&&(l.dip||l.texte))||'').trim().length,0)
  if(arr.length<1) return 'page vide'; if(nb<8) return 'page anormalement courte ('+nb+' car.)'; return null }
// ── Phase 2 — PÉRIMÈTRE DE TRAVAIL (plan 2026-08-09) ─────────────────────────────────────────────
// La complétude de l'OCR se mesure sur le LOT que l'utilisateur a choisi de traiter, PAS sur les 589
// pages du PDF. Le périmètre = les pages engagées (plage « OCR document » + pages « OCR cette page »).
function perimetreAjouter(pages){ if(!S.perimetre) S.perimetre={pages:[]}
  const set=new Set((S.perimetre.pages||[]).map(Number))
  for(const n of (pages||[])) if(Number.isFinite(Number(n))&&Number(n)>=1) set.add(Number(n))
  S.perimetre.pages=[...set].sort((a,b)=>a-b) }
function rangeInclus(de,a){ const l=[],lo=Math.min(de,a),hi=Math.max(de,a); for(let n=lo;n<=hi;n++) l.push(n); return l }
const pageFaite=n=>Array.isArray(S.pages[n]?.lignes)&&S.pages[n].lignes.length>0
// Le LOT = périmètre explicite ∪ pages réellement engagées (océrisées ou en erreur). Ainsi les vieux
// projets sans périmètre explicite ne restent pas « en cours » sur 589 pages.
function lotPages(){ const P=new Set((S.perimetre&&Array.isArray(S.perimetre.pages)?S.perimetre.pages:[]).map(Number))
  for(const k of Object.keys(S.pages)){ const n=Number(k); if(pageFaite(n)||S.pages[k]?.etat==='erreur') P.add(n) }
  return [...P].filter(Number.isFinite).sort((a,b)=>a-b) }

// OCR d'une page → avance le workflow. « OCR local » est TERMINÉ quand toutes les pages DU LOT sont
// océrisées, en erreur, ou exclues (tri) ; sinon « en cours » + nombre restant. L'état du DOCUMENT
// (X/total pages du PDF) est affiché à part et ne bloque jamais le lot (plan Phase 2, 2026-08-09).
// `perimer` : au terme d'un OCR on périme l'aval (contrôle/validation/génération devenus caducs) ; au
// simple RECHARGEMENT d'un projet on rafraîchit juste l'état OCR sans rien périmer (rien n'a changé).
function apresOcrWorkflow(perimer=true){
  const lot=lotPages()
  const faites=lot.filter(pageFaite).length
  const erreurs=lot.filter(n=>S.pages[n]?.etat==='erreur').length
  const exclues=lot.filter(n=>estExclueOcr(n)&&!pageFaite(n)&&S.pages[n]?.etat!=='erreur').length
  const manquantes=Math.max(0, lot.length - faites - erreurs - exclues)
  const docFaites=Object.keys(S.pages).filter(pageFaite).length
  const docTotal=S.total||(lot.length?Math.max(...lot):0)
  majEtapeClient('ocr_local',{ etat: manquantes>0?'en_cours':'termine', resume:{ faites, total:lot.length, manquantes, erreurs, exclues, docFaites, docTotal } })
  if(manquantes===0 && S.workflow&&S.workflow.etapes.controle_ia&&S.workflow.etapes.controle_ia.etat==='non_commence') S.workflow.etapes.controle_ia.etat='pret'
  if(perimer) for(const e of ['validation_ciblee','generation_locale']){ const s=S.workflow&&S.workflow.etapes[e]; if(s&&s.etat!=='non_commence'&&s.etat!=='perime') s.etat='perime' }
  rendreBarreEtapes() }

// §14.6 — état du fournisseur IA (sans clé) et consentement.
async function chargerEtatIA(){ try{ S.ia=await api('/api/ia/etat') }catch{ S.ia=null } }
function consentementValideClient(){ const i=S.ia; return !!(i&&i.consentement&&i.consentement.actif&&i.fournisseur&&i.consentement.fournisseur===i.fournisseur.nom&&i.consentement.date) }
function demanderConsentement(){ return new Promise((resolve)=>{ const p=$('panneauConsentement'); if(!p){ resolve(false); return }
  const f=S.ia&&S.ia.fournisseur
  p.style.display='block'; p.innerHTML=''
  const txt=document.createElement('div'); txt.innerHTML=`<b>Contrôle IA (${f?f.nom:'?'})</b> — pour relire l'OCR, La Gueule enverrait au fournisseur <b>l'image des pages déjà océrisées</b> (une par une) avec leur texte OCR, afin d'en corriger les erreurs. <b>Jamais le livre entier d'un coup, ni aucun secret du dépôt</b> (clé, configuration). La sortie reste un <b>candidat</b>, jamais une validation ; tu peux désactiver à tout moment.`
  p.appendChild(txt)
  const act=document.createElement('div'); act.className='cons-act'
  const oui=document.createElement('button'); oui.textContent='J\'accepte l\'envoi au cloud'
  oui.onclick=async()=>{ try{ await api('/api/ia/consentement',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({actif:true})}) }catch{} await chargerEtatIA(); p.style.display='none'; resolve(true) }
  const non=document.createElement('button'); non.className='discret'; non.textContent='Rester en local (mock)'
  non.onclick=()=>{ p.style.display='none'; resolve(false) }
  act.appendChild(oui); act.appendChild(non); p.appendChild(act) }) }

// Phase D — contrôle : déterministe (toujours) + IA visuel si fournisseur cloud configuré ET consenti.
async function lancerControle(){ if(!Object.keys(S.pages).length){ etat('rien à contrôler : océrise d\'abord'); return null }
  await chargerEtatIA()
  if(S.ia && S.ia.fournisseur && S.ia.fournisseur.cloud && S.ia.fournisseur.dispo && !consentementValideClient()){ await demanderConsentement() } // §14.6 : consentement avant tout envoi cloud
  // Relecture PAGE PAR PAGE, pour pouvoir dire où l'on en est et depuis combien de temps (une seule
  // requête pour tout le lot ne laissait qu'un voile muet pendant plusieurs minutes). La passe
  // déterministe n'est demandée qu'au premier appel. « Arrêter » interrompt entre deux pages.
  const pagesOcr=Object.keys(S.pages).filter(k=>Array.isArray(S.pages[k].lignes)&&S.pages[k].lignes.length).map(Number).sort((a,b)=>a-b)
  const nb=pagesOcr.length
  if(!nb){ etat('rien à contrôler : aucune page océrisée'); return null }
  majEtapeClient('controle_ia',{etat:'en_cours'},'controle_ia')
  const t0=Date.now(), S_arret_avant=S.arret; S.arret=false
  const duree=()=>{ const s=Math.round((Date.now()-t0)/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0') }
  const projet=projetActuel()
  chargeOn(`Relecture IA — page 1/${nb} · 00:00`)
  try{
    let r=null, faites=0
    // Un appel de relecture est de l'ATTENTE : le modèle lit la page, la machine ne fait rien.
    // On en mène donc PLUSIEURS de front. Le parallélisme reste modeste (3) pour ne pas saturer
    // l'abonnement ni lancer trois CLI lourds à la fois ; c'est déjà ~3× moins d'attente.
    const FRONT=3
    const fusionner=(rp)=>{
      if(!r) r=rp
      else { r.findings=[...(r.findings||[]),...(rp.findings||[])]
        for(const cle of Object.keys(rp.compteurs||{})) r.compteurs[cle]=(r.compteurs[cle]||0)+(rp.compteurs[cle]||0)
        r.ia_active=r.ia_active||rp.ia_active; r.ia_erreur=r.ia_erreur||rp.ia_erreur }
    }
    // La passe DÉTERMINISTE porte sur tout le projet : on la fait UNE fois, seule, avant de
    // paralléliser — sinon trois pages simultanées la répéteraient trois fois.
    const premier=await api('/api/ia/controle',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({projet,pages:[pagesOcr[0]],deterministe:true})})
    fusionner(premier); faites=1; S.controle=r; await sauver(true)
    for(let k=1;k<nb && !S.arret;k+=FRONT){
      const paquet=pagesOcr.slice(k,k+FRONT)
      chargeOn(`Relecture IA — page ${faites+1}-${Math.min(faites+paquet.length,nb)}/${nb} (p. ${paquet.join(', ')}) · ${duree()} écoulé`)
      const rs=await Promise.all(paquet.map(p=>
        api('/api/ia/controle',{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({projet,pages:[p],deterministe:false})}).catch(e=>({findings:[],compteurs:{},ia_erreur:String(e&&e.message||e)}))))
      for(const rp of rs) fusionner(rp)
      faites+=paquet.length
      // Sauvegarde après chaque PAQUET : au pire trois pages reperdues, jamais la passe entière.
      S.controle=r; await sauver(true)
    }
    if(S.arret) etat(`Contrôle interrompu à ${faites}/${nb} page(s) (${duree()}) — les pages déjà relues sont conservées.`)
    if(!r) return null
    S.controle=r; const c=r.compteurs||{}
    r._duree=duree()
    majEtapeClient('controle_ia',{etat:'a_verifier'})
    if(S.workflow&&S.workflow.etapes.validation_ciblee&&S.workflow.etapes.validation_ciblee.etat==='non_commence') majEtapeClient('validation_ciblee',{etat:'pret'})
    const noteIA = r.ia_active
      ? ` · IA : ${c.pages_relues||0} page(s) relue(s), ${c.ia||0} correction(s) proposée(s)`+(r.ia_erreur?` (⚠ ${r.ia_erreur})`:'')
      : ((S.ia&&S.ia.fournisseur&&S.ia.fournisseur.cloud)?' · IA cloud non consentie':' · IA locale (mock, abstention)')
    etat(`Contrôle en ${r._duree} : ${c.pages||0} page(s) — confiance faible ${c.confiance_faible||0}, vides ${c.lignes_vides||0}, doublons ${c.doublons||0}, charabia ${c.charabia||0}${noteIA}.`)
    return r
  }catch(e){ majEtapeClient('controle_ia',{etat:'erreur'}); etat('contrôle : '+e.message); return null }
  finally{ S.arret=S_arret_avant; chargeOff() } }

// Bouton « Contrôler l'OCR (IA) » : relit les pages océrisées PUIS ouvre la validation des corrections
// (les diffs avant→après s'affichent dans le panneau de validation, où tu acceptes / modifies / refuses).
async function controlerOcrIA(){ const r=await lancerControle(); if(r){ await lancerValidation(); const b=document.querySelector('#vtabs button[data-t="ctrl"]'); if(b) b.click() } }

// Phase E — validation CIBLÉE : familles + cas critiques + blocages (tu ne valides pas tout).
async function lancerValidation(){ if(!S.controle||!S.controle.findings){ etat('lance d\'abord le contrôle (étape 3)'); return }
  majEtapeClient('validation_ciblee',{etat:'en_cours'},'validation_ciblee'); chargeOn('Validation ciblée…')
  try{ const r=await api('/api/ia/validation',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({findings:S.controle.findings})})
    S.validation=r
    // Phase 4.3 : appliquer AUTOMATIQUEMENT les corrections simples (peu de caractères changés) — aucun
    // clic. Elles restent des candidats (réversibles) ; seuls les cas ambigus/structurels restent à valider.
    if(Array.isArray(r.auto_texte)&&r.auto_texte.length){ let n=0; for(const f of r.auto_texte){ const x=appliquerFinding(f,false); if(x&&x.ok&&x.statut!=='deja_applique') n++ } if(n){ planifierSave(); rendre() } }
    // Tout le contrôle se pilote depuis l'onglet « Contrôle » du volet GAUCHE — le grand bandeau du haut
    // est masqué (la pleine page n'était pas pratique). On ouvre l'onglet et on y rend les propositions.
    if($('panneauValidation')) $('panneauValidation').style.display='none'
    rendreVoletControle(); majBadgeControle()
    { const _bc=document.querySelector('#vtabs button[data-t="ctrl"]'); if(_bc&&!_bc.classList.contains('actif')) _bc.click() }
    const bloque=r.blocages.length>0
    majEtapeClient('validation_ciblee',{etat: bloque?'bloque':'a_verifier'})
    if(!bloque && S.workflow&&S.workflow.etapes.generation_locale&&S.workflow.etapes.generation_locale.etat==='non_commence') majEtapeClient('generation_locale',{etat:'pret'})
    etat(`Validation : ${r.compteurs.critiques} critique(s), ${r.compteurs.blocages} blocage(s), ${r.compteurs.familles} famille(s), ${r.compteurs.automatiques} auto — ${bloque?'export « complet » bloqué (provisoire possible avec avertissement)':'prêt pour la génération'}.`)
  }catch(e){ majEtapeClient('validation_ciblee',{etat:'erreur'}); etat('validation : '+e.message) }
  finally{ chargeOff() } }
function rendrePanneauValidation(){ const p=$('panneauValidation'); if(!p)return; const v=S.validation; if(!v){ p.style.display='none'; return }
  p.style.display='block'; p.innerHTML=''; const c=v.compteurs
  const tete=document.createElement('div'); tete.className='val-tete'
  const info=document.createElement('span'); info.innerHTML=`<b>Validation ciblée</b> — corrections ${c.corrections||0} · critiques ${c.critiques} · familles ${c.familles} · avertissements ${c.avertissements||0} · blocages ${c.blocages} · auto ${c.automatiques} · non résolus ${c.non_resolus}`
  const fermer=document.createElement('button'); fermer.className='discret'; fermer.textContent='fermer'; fermer.onclick=()=>{ p.style.display='none' }
  tete.appendChild(info); tete.appendChild(fermer); p.appendChild(tete)
  // Phase 4 — CORRECTIONS INDIVIDUELLES : chaque changement de texte/rôle est un OBJET distinct, relu
  // un à un (plus de fausse famille « relecture_page »). « Tout accepter » les applique comme objets.
  if(v.corrections&&v.corrections.length){ const h=document.createElement('div'); h.className='val-tete'
    const s=document.createElement('span'); s.innerHTML=`<b>Corrections proposées</b> — ${v.corrections.length} à relire (chacune individuelle)`
    const tout=document.createElement('button'); tout.className='discret'; tout.textContent='Tout accepter'
    tout.title='Applique CHAQUE correction dans la couche candidate (objets distincts ; les conflits sont signalés, jamais écrasés).'
    tout.onclick=()=>accepterCorrections(v.corrections)
    h.appendChild(s); h.appendChild(tout); p.appendChild(h)
    for(const f of v.corrections) p.appendChild(rendreItemDecision(f)) }
  // Cas CRITIQUES (R3) présentés individuellement — même rendu que les corrections.
  for(const f of v.critiques) p.appendChild(rendreItemDecision(f))
  // Familles de FLAGS répétitifs (confiance faible, doublon, page ignorable…) : échantillonnage.
  for(const fam of v.familles){ const d=document.createElement('div'); d.className='val-fam'
    const s=document.createElement('span'); s.textContent=`${fam.cle} — ${fam.nb} occurrence(s), risque ${fam.risque}`
    const b=document.createElement('button'); b.className='discret'; b.textContent='Accepter la famille'
    b.title='Applique la famille dans la couche candidate (statut accepté par échantillonnage ; PAS du ground-truth).'
    b.onclick=()=>accepterFamille(fam.cle)
    d.appendChild(s); d.appendChild(b); p.appendChild(d) }
  // Phase 5 — avertissements (pages courtes / réserves) : informatifs, n'empêchent JAMAIS l'export.
  if(v.avertissements&&v.avertissements.length){ const aw=document.createElement('div'); aw.className='val-fam'; aw.style.color='var(--second)'
    const pages=[...new Set(v.avertissements.map(x=>x.page).filter(x=>x!=null))].sort((a,b)=>a-b)
    aw.textContent='ⓘ '+v.avertissements.length+' avertissement(s) — pages courtes / réserves'+(pages.length?' (p. '+pages.slice(0,20).join(', ')+')':'')+' — n\'empêchent pas l\'export.'; p.appendChild(aw) }
  if(v.blocages.length){ const bl=document.createElement('div'); bl.className='val-bloc'; bl.textContent='⛔ '+v.blocages.length+' blocage(s) — export « complet » impossible tant qu\'ils ne sont pas levés.'; p.appendChild(bl) } }
// Rendu PARTAGÉ d'une décision individuelle (correction de texte OU reclassement de rôle) : en-tête,
// avant → après, boutons Accepter / Modifier / Refuser / Indéterminé, et « voir » la région sur l'image.
const ECH=(s)=>String(s??'').replace(/</g,'&lt;')
// Vocabulaire d'AFFICHAGE des rôles, partagé par tout l'atelier. Le rôle interne reste celui de
// structure.mjs ; ce qu'on montre est en français d'éditeur — « signature » se dit « marque de
// cahier », et ne doit plus paraître autrement.
const LIB_ROLE={corps:'corps',titre:'titre',vers:'vers',titre_courant:'titre courant',numero_page:'numéro de page',
  signature:'marque de cahier',reclame:'réclame',ornement:'ornement',bruit:'bruit',note_marginale:'note en marge',
  note_bas_page:'note de bas de page',paratexte_titre:'mention de page de titre',indetermine:'indéterminé'}
const libRole=(r)=>LIB_ROLE[roleBase(r)]||String(r||'').replace(/_/g,' ')
// L'analyse de structure émet des rôles PROVISOIRES suffixés (« lettrine_candidate »,
// « reclame_candidate_geometrique »…). Pour la couleur et le libellé, seule la famille compte —
// le suffixe dit l'état de la décision, pas la nature de la ligne.
const ROLE_ALIAS={lettrine:'corps',artefact:'bruit',paratexte:'paratexte_titre',ornement:'ornement'}
function roleBase(r){ const b=String(r||'').replace(/_candidate.*$/,''); return ROLE_ALIAS[b]||b||'corps' }
function rendreItemDecision(f){ const d=document.createElement('div'); d.className='val-crit'
  const estRe=f.type==='reclassement_role', estAnc=f.type==='ancrage_note', estOmi=f.type==='ligne_omise'
  const estSci=f.type==='scission_marge'
  const icone = estRe?'⤳ reclasser' : estAnc?'❡ rattacher la note' : estOmi?'＋ ligne omise'
    : estSci?'⇥ séparer corps et marge' : '✎ '+(f.regle||f.id||'correction')
  const t=document.createElement('div'); t.className='val-crit-tete'
  t.textContent=`${icone} · ${f.niveau_risque} · page ${f.page??'?'}${(f.ligne_ids&&f.ligne_ids.length)?' l'+f.ligne_ids.join(','):''}`
  d.appendChild(t)
  const av=document.createElement('div'); av.className='val-avapr'
  if(estRe) av.innerHTML=`rôle : <span class="av">${f.role_avant||'corps'}</span> → <span class="apr">${f.role_apres||'?'}</span> <span style="color:var(--second)">« ${ECH((f.texte_original||'').slice(0,48))} »</span>`
  else if(estAnc){
    // On montre CE QUI SE PASSE : la note, la ligne annotée, et où l'appel ira.
    const pg=S.pages[f.page]||{}; const corps=(pg.lignes&&pg.lignes[f.corps_i])?String(pg.lignes[f.corps_i].dip||''):''
    av.innerHTML=`note <span class="av">« ${ECH((f.texte_original||'').slice(0,44))} »</span><br>`
      +`→ appel <b>[[${f.numero_note??'?'}]]</b> dans <span class="apr">« ${ECH(corps.slice(0,60))} »</span>`
      +(f.apres?` <span style="color:var(--second)">après « ${ECH(f.apres)} »</span>`:'')
      +`<br><span style="color:var(--second)">${f.regle==='appel_imprime'?'appel imprimé retrouvé dans le texte (mécanique)':'rattachement par lecture (à contrôler)'}</span>`
  }
  else if(estOmi) av.innerHTML=`ligne absente de l’OCR, visible sur l’image :<br><span class="apr">« ${ECH(f.texte_candidat||'')} »</span> <span style="color:var(--second)">(à insérer après la ligne ${f.apres_i})</span>`
  else if(estSci){
    // On montre les DEUX lignes qui vont naître : la note ne se tronque pas, elle se sépare entière.
    const pg=S.pages[f.page]||{}; const orig=(pg.lignes&&pg.lignes[f.ligne_ids[0]])?String(pg.lignes[f.ligne_ids[0]].dip||''):''
    av.innerHTML=`<span class="av">${ECH(orig)}</span><br>`
      +`→ corps : <span class="apr">« ${ECH(f.corps||'')} »</span><br>`
      +`→ note en marge (ligne entière) : <span class="apr" style="background:#f2e2d0">« ${ECH(f.marge||'')} »</span>`
  }
  else av.innerHTML=`<span class="av">${ECH(f.texte_original||'∅')}</span> → <span class="apr">${ECH(f.texte_candidat||'∅')}</span>`
  d.appendChild(av)
  const act=document.createElement('div'); act.className='val-crit-act'
  for(const [lib,st] of [['Accepter','confirme_humain'],['Modifier','modifie_humain'],['Refuser','refuse'],['Indéterminé','indetermine']]){
    if((estRe||estAnc)&&st==='modifie_humain') continue // ni un reclassement ni un ancrage n'éditent de texte
    const bt=document.createElement('button'); bt.className='discret'; bt.textContent=lib
    bt.onclick=()=>decisionCritique(f, st); act.appendChild(bt) }
  if(Array.isArray(f.bbox)&&f.page!=null&&S.pages[f.page]&&S.pages[f.page].pngUrl){ const z=document.createElement('button'); z.className='discret'; z.textContent='🔍 voir'
    z.onclick=()=>{ const save=S.page; S.page=f.page; zoomRegion(f.bbox); S.page=save }; act.appendChild(z) }
  d.appendChild(act); return d }
// « Tout accepter » les corrections proposées : applique chacune comme objet distinct, signale les conflits.
function accepterCorrections(list){ let ok=0,conf=0

  planifierSave(); rendre(); etat(`Corrections : ${ok} appliquée(s)${conf?`, ${conf} conflit(s) non appliqué(s)`:''}.`); lancerValidation() }

// Va sur la page ET pointe la ligne. La ligne peut n'être pas encore dans le DOM au moment du clic

// correspondante sur le fac-similé, pour qu'on voie tout de suite de quoi il s'agit.
function allerLigneControle(f){ if(!f||f.page==null)return
  const changePage = Number(f.page)!==Number(S.page)
  S.page=Number(f.page); if($('page'))$('page').value=S.page
  if(changePage) rendre()
  const i=(f.ligne_ids&&f.ligne_ids.length)?f.ligne_ids[0]:null
  if(i==null){ etat('page '+S.page); return }
  let essais=0
  const viser=()=>{
    const row=document.querySelector('.lg[data-i="'+i+'"]')
    if(!row){ if(essais++<20){ requestAnimationFrame(viser); return } etat('page '+S.page+' — ligne '+i+' introuvable (page pas encore rendue ?)'); return }
    row.classList.add('cible'); row.scrollIntoView({block:'center',behavior:'smooth'})
    const box=$('voletImage')&&$('voletImage').querySelector('.box[data-i="'+i+'"]')
    if(box){ box.classList.add('cible'); box.scrollIntoView({block:'center',behavior:'smooth'}) }
    setTimeout(()=>{ row.classList.remove('cible'); if(box) box.classList.remove('cible') },2600)
    etat('page '+S.page+' — ligne '+i)
  }
  requestAnimationFrame(viser) }

// Accepte un LOT de reclassements de même rôle : chacun est appliqué comme objet distinct (donc
// tracé et annulable un à un), les conflits sont signalés et jamais écrasés.
function accepterLot(liste, libelle){ let ok=0, conf=0
  for(const f of (liste||[])){ const r=appliquerFinding(f, true)
    if(r&&r.ok&&r.statut!=='deja_applique'){ f.statut='confirme_humain'; ok++ }
    else if(r&&r.conflit) conf++ }
  planifierSave(); rendre()
  etat(`${ok} ligne(s) reclassée(s) en « ${libelle} »${conf?`, ${conf} conflit(s) non appliqué(s)`:''} — annulable ligne par ligne.`)
  lancerValidation() }

// ── Échantillonnage auto-extensible (miroir de validation.mjs::echantillonner) : les occurrences les
// MOINS sûres d'abord (confiance basse = plus probable erreur), étalées sur les pages, au plus n. ──
function echantillonnerClient(occ, n){ n=n||5; const arr=[...(occ||[])].sort((a,b)=>(a.confiance_modele??1)-(b.confiance_modele??1))
  const choisi=[], vues=new Set()
  for(const o of arr){ if(choisi.length>=n)break; if(!vues.has(o.page)){ choisi.push(o); vues.add(o.page) } }
  for(const o of arr){ if(choisi.length>=n)break; if(!choisi.includes(o)) choisi.push(o) }
  return choisi }
function texteOccurrence(f){ const pg=S.pages[f.page]; const i=(f.ligne_ids&&f.ligne_ids.length)?f.ligne_ids[0]:null
  const l=pg&&Array.isArray(pg.lignes)&&i!=null?pg.lignes[i]:null; return l?String(l.dip??l.texte??''):('page '+f.page) }
// Contrôle d'une famille par échantillon : 0 erreur → accepter la famille ; 1 → étendre à 15 ; ≥2 → détaillé.
function controlerFamille(fam, conteneur, taille){ taille=taille||5; conteneur.innerHTML=''
  const ech=echantillonnerClient(fam.occurrences||[], taille); const faux=new Set()
  const info=document.createElement('div'); info.className='ctrl-vide'
  info.textContent='Échantillon de '+ech.length+' sur '+fam.nb+' — clique « ✗ faux » si une occurrence est une fausse alerte :'
  conteneur.appendChild(info)
  ech.forEach((f,idx)=>{ const it=document.createElement('div'); it.className='ctrl-item'
    // Indication PRÉCISE : le texte réel de la ligne, la raison, et la confiance mesurée — sans
    // quoi l'échantillon n'affichait qu'une citation vide et rien à juger.
    const txt=String(texteOccurrence(f)).slice(0,70)
    const raison=(f.preuves&&f.preuves.length)?String(f.preuves[0]):(f.regle||'')
    const conf=(f.confiance_modele!=null&&f.confiance_modele>0)?' · conf '+String(Math.round(f.confiance_modele*100))+' %':''
    const t=document.createElement('div'); t.className='ct-avapr'
    t.innerHTML='<b>p.'+f.page+((f.ligne_ids&&f.ligne_ids.length)?' l'+f.ligne_ids.join(','):'')+'</b>'+conf
      +'<br>« '+(txt?ECH(txt):'<i style="color:var(--second)">ligne vide</i>')+' »'
      +(raison?'<br><span style="color:var(--second)">'+ECH(raison)+'</span>':'')
    it.appendChild(t)
    const act=document.createElement('div'); act.className='ct-act'
    const vo=document.createElement('button'); vo.className='discret'; vo.textContent='Voir'; vo.onclick=()=>allerLigneControle(f)
    if(Array.isArray(f.bbox)&&f.bbox.length===4){ const z=document.createElement('button'); z.className='discret'; z.textContent='🔍'
      z.title='Agrandir cette ligne sur le fac-similé'
      z.onclick=()=>{ const save=S.page; S.page=Number(f.page); zoomRegion(f.bbox); S.page=save }; act.appendChild(z) }
    const fx=document.createElement('button'); fx.className='discret'; fx.textContent='✗ faux'
    fx.onclick=()=>{ if(faux.has(idx)){ faux.delete(idx); fx.classList.remove('ct-vld'); fx.textContent='✗ faux' } else { faux.add(idx); fx.classList.add('ct-vld'); fx.textContent='✓ faux' } maj() }
    act.appendChild(vo); act.appendChild(fx); it.appendChild(act); conteneur.appendChild(it) })
  const pied=document.createElement('div'); pied.className='ctrl-vide'; conteneur.appendChild(pied)
  const boutons=document.createElement('div'); boutons.className='ct-act'; conteneur.appendChild(boutons)
  function maj(){ const n=faux.size
    pied.textContent = n===0 ? '✓ Aucune erreur dans l\'échantillon — tu peux accepter la famille.'
      : (n===1 ? '1 erreur — élargis l\'échantillon (15) avant d\'accepter.' : n+' erreurs — contrôle détaillé conseillé (traite les occurrences une à une).')
    boutons.innerHTML=''
    if(n===0){ const ok=document.createElement('button'); ok.className='ct-vld'; ok.textContent='Accepter la famille ('+fam.nb+')'; ok.onclick=()=>accepterFamille(fam.cle); boutons.appendChild(ok) }
    if(n===1 && taille<15){ const ext=document.createElement('button'); ext.className='discret'; ext.textContent='Étendre à 15'; ext.onclick=()=>controlerFamille(fam, conteneur, 15); boutons.appendChild(ext) } }
  maj() }
// ── Phase 1 — matérialiser les corrections dans le TEXTE candidat (miroir de src/corrections.mjs) ──
// L'atelier est un monofichier sans import : on reproduit ici, à l'identique, les règles testées côté
// serveur. Écrit `dip`, préserve `ocr0`, journalise l'historique, détecte le CONFLIT (jamais d'écrasement
// silencieux d'une modification humaine ou d'une correction plus récente). Ne touche jamais l'OCR brut.
function appliquerCorrectionClient(l, corr){ if(!l||typeof l!=='object') return {ok:false,erreur:'ligne'}
  const avant=String(corr.avant??''), apres=String(corr.apres??''), actuel=String(l.dip??'')
  if(apres===''&&!corr.autoriserVide) return {ok:false,erreur:'vide'}
  if(actuel===apres) return {ok:true,statut:'deja_applique'}
  if(actuel!==avant) return {ok:false,conflit:true,attendu:avant,actuel}
  if(l.ocr0==null) l.ocr0=actuel
  if(!Array.isArray(l.corrections)) l.corrections=[]
  l.corrections.push({ id:corr.id||null, type:corr.type||'correction_ocr', avant, apres, origine:corr.origine||'ia',
    modele:corr.modele||null, regle:corr.regle||null, statut:corr.statut||'applique_candidate',
    validation_humaine:!!corr.validation_humaine, annulee:false, date:new Date().toISOString() })
  l.dip=apres; return {ok:true}
}
// Phase 3 — miroir client de appliquerReclassement : pose role_confirme (fait foi), recalcule export_corps,
// journalise. Ne touche NI le texte, NI l'OCR : la ligne reste en source, écartée du seul corps exporté.
const ROLES_HORS_CORPS_CLIENT=['numero_page','signature','reclame','titre_courant','paratexte_titre','ornement','bruit']
function appliquerReclassementClient(l, corr){ if(!l||typeof l!=='object') return {ok:false,erreur:'ligne'}
  const apres=String(corr.role_apres??''); if(!apres) return {ok:false,erreur:'role'}
  const avant=corr.role_avant??null
  if(!l.suggestion||typeof l.suggestion!=='object') l.suggestion={}
  const actuel=l.suggestion.role_confirme??null
  if(actuel===apres) return {ok:true,statut:'deja_applique'}
  if(actuel!=null&&avant!=null&&actuel!==avant) return {ok:false,conflit:true,attendu:avant,actuel}
  if(!Array.isArray(l.corrections)) l.corrections=[]
  l.corrections.push({ id:corr.id||null, type:'reclassement_role', avant:String(avant??''), apres, role_avant:avant, role_apres:apres,
    _role_precedent:actuel, origine:corr.origine||'ia', modele:corr.modele||null, regle:corr.regle||null,
    statut:'applique_candidate', validation_humaine:!!corr.validation_humaine, annulee:false, date:new Date().toISOString() })
  l.suggestion.role_confirme=apres; l.suggestion.export_corps=!ROLES_HORS_CORPS_CLIENT.includes(apres)
  return {ok:true}
}
// Applique un finding à sa ligne : reclassement de rôle (Phase 3) OU correction de texte (Phase 1).
function appliquerFinding(f, humaine){ if(f==null||!Array.isArray(f.ligne_ids)||!f.ligne_ids.length||f.page==null) return {ok:false,erreur:'non-correction'}
  const pg=S.pages[f.page]; if(!pg||!Array.isArray(pg.lignes)) return {ok:false,erreur:'page'}
  const l=pg.lignes[f.ligne_ids[0]]; if(!l) return {ok:false,erreur:'ligne'}
  if(f.type==='reclassement_role') return appliquerReclassementClient(l, { id:f.id, role_avant:f.role_avant, role_apres:f.role_apres, origine:'ia', modele:f.modele, regle:f.regle, validation_humaine:!!humaine })
  // ANCRAGE D'UNE NOTE (§13) : pose l'appel [[n]] dans la ligne de CORPS annotée (pas dans la note),
  // et estampille les lignes de la note avec ce numéro. Miroir client de corrections.mjs::appliquerAncrage.
  if(f.type==='ancrage_note') return appliquerAncrageClient(pg, f, !!humaine)
  // LIGNE OMISE (§1.2) : insère la ligne manquante APRÈS f.apres_i, sans bbox ni ocr0 (donc hors GT).
  if(f.type==='ligne_omise') return appliquerLigneOmiseClient(pg, f, !!humaine)
  // SCISSION : la ligne mixte devient corps + note ENTIÈRE. Miroir de src/scission.mjs.
  if(f.type==='scission_marge') return appliquerScissionClient(pg, f.ligne_ids[0], f, !!humaine)
  if(f.texte_candidat==null) return {ok:false,erreur:'non-correction'}
  return appliquerCorrectionClient(l, { id:f.id, avant:f.texte_original, apres:f.texte_candidat, origine:'ia', modele:f.modele, regle:f.regle, validation_humaine:!!humaine })
}
// Pose l'appel [[n]] dans la ligne de corps, collé au mot annoté, À L'INTÉRIEUR d'un guillemet fermant
// (§13.3). Passe par appliquerCorrectionClient → ocr0 préservé, historique, conflit détecté, annulable.
function poserAppelClient(t, numero, apres){ const appel='[['+numero+']]'; const s=String(t||'')
  if(apres){ const i=s.indexOf(String(apres)); if(i>=0){ const p=i+String(apres).length; return { texte:s.slice(0,p)+appel+s.slice(p), place:'apres_groupe' } } }
  const m=/[\s]*[»”"’)\]]+[.,;:!?]*\s*$/u.exec(s)
  if(m&&m.index>0) return { texte:s.slice(0,m.index)+appel+s.slice(m.index), place:'avant_fermant' }
  return { texte:s.replace(/\s*$/,'')+appel, place:'fin_de_ligne' } }
function appliquerAncrageClient(pg, f, humaine){
  const numero=Number(f.numero_note); if(!Number.isInteger(numero)||numero<1) return {ok:false,erreur:'numéro absent'}
  const cible=pg.lignes[f.corps_i]; if(!cible) return {ok:false,erreur:'ligne de corps introuvable'}
  const avant=String(cible.dip??cible.texte??'')
  if(avant.includes('[['+numero+']]')) return {ok:true,statut:'deja_applique'}
  const { texte, place }=poserAppelClient(avant, numero, f.apres)
  const r=appliquerCorrectionClient(cible, { id:f.id, avant, apres:texte, origine:'ia', modele:f.modele, regle:'ancrage_note', validation_humaine:!!humaine })
  if(!r||!r.ok) return r
  for(const i of (f.lignes_note||[])) if(pg.lignes[i]) pg.lignes[i].note_numero=numero
  return { ok:true, statut:r.statut, numero, place } }
// Scinde une ligne qui mêle corps et marge : le corps reste, la note devient une LIGNE ENTIÈRE
// juste après, classée « note en marge ». `ocr0` de la ligne d'origine n'est jamais réécrit.
function appliquerScissionClient(pg, i, f, humaine){
  const l=pg.lignes[i]; if(!l) return {ok:false,erreur:'ligne introuvable'}
  const corps=String(f.corps||'').trim(), marge=String(f.marge||'').trim()
  if(!corps||!marge) return {ok:false,erreur:'scission incomplète'}
  if(pg.lignes[i+1]&&pg.lignes[i+1].scinde_de===i) return {ok:true,statut:'deja_applique'}
  const avant=String(l.dip??l.texte??'')
  if(l.ocr0==null) l.ocr0=avant
  if(!Array.isArray(l.corrections)) l.corrections=[]
  l.corrections.push({type:'scission_marge',avant,apres:corps,origine:'ia',modele:f.modele||null,regle:'scission_marge',
    statut:'applique_candidate',validation_humaine:!!humaine,annulee:false,fragment:marge})
  l.dip=corps
  pg.lignes.splice(i+1,0,{bbox:null,ocr0:'',dip:marge,texte:marge,scinde_de:i,origine_ajout:'ia',
    suggestion:{role_suggere:'note_marginale',role_confirme:null,statut:'suggere',regle:'scission_marge',export_corps:false,preuves:{issue_de_la_ligne:i}}})
  return {ok:true,statut:'applique_candidate'} }
function appliquerLigneOmiseClient(pg, f, humaine){
  const texte=String(f.texte_candidat||'').trim(); if(!texte) return {ok:false,erreur:'texte vide'}
  const pos=Number(f.apres_i)
  if(pg.lignes.some(l=>l&&l.ajout_humain&&String(l.dip||'')===texte)) return {ok:true,statut:'deja_applique'}
  // Sans bbox ni ocr0 : comptée dans le texte, écartée du ground-truth (comme « ＋ ligne manquante »).
  pg.lignes.splice(pos+1, 0, { bbox:null, ocr0:'', dip:texte, ajout_humain:true, origine_ajout:'ia', validation_humaine:!!humaine })
  return { ok:true, statut:'applique_candidate' } }
// Décision humaine sur un cas critique : met à jour le finding source ET applique/rétracte réellement le
// texte candidat (Phase 1). Accepter/Modifier → écrit dip ; Refuser/Indéterminé → ne touche pas au texte.
function decisionCritique(f, statut){ if(!S.controle||!S.controle.findings)return
  const memeFinding=(g)=>((g.regle||g.id)===(f.regle||f.id))&&g.page===f.page&&JSON.stringify(g.ligne_ids||[])===JSON.stringify(f.ligne_ids||[])
  let conflit=false
  S.controle.findings.forEach(g=>{ if(!memeFinding(g))return
    g.statut=statut
    if(statut==='modifie_humain'){ const m=window.prompt('Texte corrigé :', g.texte_candidat||g.texte_original||''); if(m!=null) g.texte_candidat=m }
    if(statut==='confirme_humain'||statut==='modifie_humain'){ const r=appliquerFinding(g, true); if(r&&r.conflit) conflit=true }
  })
  planifierSave(); rendre()
  if(conflit) etat('⚠ conflit : le texte de cette ligne a changé depuis le contrôle — correction NON appliquée (relance le contrôle).')
  lancerValidation() }
// Accepter une famille : applique RÉELLEMENT chaque correction du lot (statut accepté par échantillonnage),
// et recense les conflits restants (jamais d'écrasement silencieux). Les familles sans texte (pages
// ignorables, etc.) ne font que changer de statut.
function accepterFamille(cle){ if(!S.controle||!S.controle.findings){ return }
  let applic=0, conflits=0
  S.controle.findings.forEach(f=>{ if((f.regle||f.id||f.type)!==cle || f.statut!=='propose_ia') return
    f.statut='accepte_echantillonnage'
    if(f.texte_candidat!=null){ const r=appliquerFinding(f, false); if(r&&r.ok&&r.statut!=='deja_applique') applic++; else if(r&&r.conflit) conflits++ } })
  planifierSave(); rendre()
  if(applic||conflits) etat(`Famille « ${cle} » : ${applic} correction(s) appliquée(s)${conflits?`, ${conflits} conflit(s) non appliqué(s)`:''}.`)
  lancerValidation() } // recompte : la famille passe des « familles » aux « automatiques »

// ── Fiabilité des lots : état par page (à faire / terminé / erreur), progression, journal ────
function marquerEtat(n, etat, msg){ if(!S.pages[n]) S.pages[n]={}; S.pages[n].etat=etat
  if(etat==='erreur') S.pages[n].erreur=String(msg||'').slice(0,300); else delete S.pages[n].erreur }
function journaliser(n, msg){ (S.journal||(S.journal=[])).push({page:n, message:String(msg).slice(0,200), at:new Date().toISOString()})
  if(S.journal.length>1000) S.journal=S.journal.slice(-1000) }
function pagesEnErreur(){ return Object.keys(S.pages).map(Number).filter(n=>S.pages[n]?.etat==='erreur').sort((a,b)=>a-b) }
function estExclueOcr(n){ const t=S.pages[n]&&S.pages[n].triage; return !!(t && t.a_ocriser===false) } // tri IA : garde/numérisation/reliure/ornement
function pagesATraiter(de,a){ const l=[]; for(let n=de;n<=a;n++) if(S.pages[n]?.etat!=='termine' && !estExclueOcr(n)) l.push(n); return l } // saute les faites ET les pages exclues par le tri
function compterEtats(de,a){ let fait=0,err=0,tot=0; for(let n=de;n<=a;n++){ tot++; const e=S.pages[n]?.etat; if(e==='termine')fait++; else if(e==='erreur')err++ } return {fait,err,tot} }
function majProgres(de,a){ const {fait,err,tot}=compterEtats(de,a); $('progression').style.display='flex'
  $('barreProgFill').style.width=(tot?Math.round(fait/tot*100):0)+'%'
  $('progTexte').textContent=`${fait}/${tot} pages · ${err} erreur${err>1?'s':''}`
  const pe=pagesEnErreur(); $('btnRelancerErr').style.display=pe.length?'inline-block':'none'
  $('progErreurs').textContent=pe.length?('en erreur : '+pe.slice(0,25).join(', ')+(pe.length>25?'…':'')):'' }
function assurerNomProjet(){ if($('projet').value.trim())return // un lot est TOUJOURS persisté : on nomme d'office
  const c=$('chemin').value.trim(); const b=(c.split(/[\\/]/).pop()||'ouvrage').replace(/\.[^.]+$/,'').replace(/[^\w.-]+/g,'_').slice(0,60)
  $('projet').value=b||'ouvrage' }

const chargeOn=(t)=>{ $('chargeTexte').textContent=t||'Analyse…'; $('chargeStop').disabled=false; $('chargement').style.display='flex' }
const chargeOff=()=>{ $('chargement').style.display='none' }

async function analyser(){
  const chemin=$('chemin').value.trim(); if(!chemin)return
  if(S.chemin!==chemin){ S.perimetre={pages:[]}; S.chemin=chemin } // nouveau document → nouveau lot de travail (Phase 2)
  chargeOn('Analyse du document…')
  try{
    if(S.kind==='imprime'){
      const {pages}=await api('/api/pdf-info?path='+encodeURIComponent(chemin)); S.total=pages
      $('total').textContent=pages?`/ ${pages}`:''; $('a').value=Math.min(pages||1,($('de').valueAsNumber||1)+9)
      // Analyse LÉGÈRE au dépôt (rapide) : page de titre + sonde de typographie, PAS d'OCR du document.
      chargeOn('Analyse rapide (page de titre + typographie)…')
      const r=await api('/api/metadonnees',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path:chemin, rapide:true})})
      // Métadonnées : plus de pré-remplissage mécanique au dépôt — « IA titre » (Opus) fait la lecture.
      $('main').classList.remove('meta-replie')
      // Choix AUTOMATIQUE du moteur adapté à ce livre (imprimé ancien à s long → Kraken).
      const anc=r.typographie?.ancien; $('typo').value=anc?'ancien':'moderne'
      await finaliserDiagnostic({ nbPages:pages, meta:r.meta, typographie:r.typographie }) // Phase B : profil + avance du workflow
      etat(`PDF : ${pages} pages — diagnostic fait. Moteur conseillé : ${anc?'imprimé ANCIEN (s long → Kraken)':'moderne (Tesseract)'} — ${r.typographie?.raison||''}. Étape suivante : « OCR local » (« OCR cette page » / « OCR document »).`)
    } else {
      S.total=1; $('total').textContent=''; await finaliserDiagnostic({ nbPages:1, manuscrit:true }); etat('image (manuscrit) prête — moteur Kraken CATMuS Medieval. Étape suivante : « OCR cette page ».')
    }
    S.page=1; $('page').value=1; rendre() // affiche la 1re page (aperçu du PDF/image) dès le dépôt, sans OCR
  }catch(e){ etat('erreur : '+e.message) }
  finally{ chargeOff() }
}

async function ocr(n){
  perimetreAjouter([n]) // Phase 2 : toute page océrisée entre dans le lot de travail
  const chemin=$('chemin').value.trim(); if(!chemin)throw new Error('chemin manquant')
  if(S.kind==='imprime' && $('bilingue').checked){
    const r=await api('/api/atelier/ocr-bilingue',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({pdfWin:chemin,page:n,offset:Number($('offset').value),dpi:300})})
    S.pages[n]={ pngUrl:r.pngUrl, largeur:r.largeur, hauteur:r.hauteur, bilingue:true, ocr:r.ocr,
      langueFr:r.langueFr, langueLa:r.langueLa,
      lignes:(r.lignesFr||[]).map(l=>({bbox:l.bbox, dip:l.texte})),
      paires:(r.paires||[]).map(p=>({paragraphe:p.paragraphe, fr:p.fr, la:p.la})) }
    apresOcrWorkflow() // Phase C : OCR local → workflow
    return S.pages[n]
  }
  // Phase C — moteur/modèle selon le RÉGIME de la page (profil du diagnostic), sinon le sélecteur Typo.
  const reg=regimePourPageClient(n)
  const ancien = reg ? (reg.moteur==='kraken') : ($('typo') && $('typo').value==='ancien') // imprimé ancien → Kraken CATMuS-Print
  const pre=$('p_utiliser')&&$('p_utiliser').checked ? collecterPretraitement() : null // OFF par défaut
  const corps=S.kind==='imprime'
    ? {kind:'imprime',pdfWin:chemin,page:n,dpi:300,lang:langueOcr(),moteur:ancien?'kraken-print':'tesseract',pretraitement:pre}
    : {kind:'manuscrit',imageWin:chemin}
  const r=await api('/api/atelier/ocr',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(corps)})
  S.pages[n]={ pngUrl:r.pngUrl, largeur:r.largeur, hauteur:r.hauteur, ocr:r.ocr,
    lignes:(r.lignes||[]).map(l=>({bbox:l.bbox, confiance:l.confiance, ocr0:l.texte, dip:l.texte, dev:l.texte, mod:''})) }
  const anom=pageAnormaleClient(S.pages[n].lignes); if(anom){ S.pages[n].anomalie=anom } else { delete S.pages[n].anomalie } // §7.2 : signaler page vide/courte
  apresOcrWorkflow() // Phase C : OCR local → workflow
  return S.pages[n]
}

// Titre courant / n° de page — mêmes règles qu'à l'export (projet.mjs::estEntete). Conservateur.
function estEnteteC(t){ const s=(t||'').trim()
  if(!s) return true
  if(/^[_—–\-\s.]*\d{1,4}[_—–\-\s.]*$/.test(s)) return true
  if(/^\d{0,4}\s*[A-ZÀ-Þ][A-ZÀ-Þ'’ .-]{2,24}\d{0,4}$/.test(s)) return true
  if(/digitized by google/i.test(s)) return true
  return false
}
